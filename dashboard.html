<!DOCTYPE html>
<html lang="ms">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HE Bloom Edu Games</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:
        linear-gradient(
            135deg,
            #f8efff 0%,
            #dfe9ff 45%,
            #d9f9ff 75%,
            #fff0f8 100%
        );

    min-height:100vh;

    padding:25px 20px;

    position:relative;
    overflow-x:hidden;
}


/* =========================
   CONTAINER
========================= */

.container{
    width:100%;
    max-width:380px;
    margin:auto;
    text-align:center;
}


/* =========================
   TAJUK
========================= */

h1 {
  color: #ff4fa3;
  
  text-align: center;
  
  font-size: 28px;
  font-weight: 900;
  
  line-height: 1.1;
  
  margin-top: 5px;
  margin-bottom: 18px;
  
  white-space: nowrap;
  
  text-shadow:
    2px 2px 0 #ffffff,
    -2px -2px 0 #ffffff,
    0 3px 0 #ffffff,
    0 5px 0 #62c9ff,
    0 8px 10px rgba(70, 150, 220, .45);
}
/* =========================
   WELCOME
========================= */

.welcome{
    display:inline-block;

    background:
        linear-gradient(
            135deg,
            #ff9dcc 0%,
            #ff72b5 50%,
            #8fd3ff 100%
        );

    color:white;

    font-size:23px;
    font-weight:800;

    padding:9px 45px;

    border-radius:35px;

    margin-bottom:28px;

    border:2px solid #ffffff;

    box-shadow:
        0 6px 15px rgba(255,120,190,.30),
        0 0 15px rgba(143,211,255,.30);

    text-shadow:
        1px 2px 2px rgba(120,60,120,.25);
}

/* =========================
   MAIN MENU
========================= */

.menu{
    width:100%;

    background:rgba(255,255,255,.97);

    min-height:78px;

    padding:12px 16px;

    margin-bottom:12px;

    border-radius:22px;

    border:3px solid #ff9dcc;

    box-shadow:
        0 5px 15px rgba(120,160,210,.15),
        0 0 12px rgba(255,130,190,.18);

    display:flex;

    align-items:center;

    text-align:left;

    cursor:pointer;

    transition:.2s;
}

.menu:hover{
    transform:scale(1.02);
}

.menu:active{
    transform:scale(.97);
}


/* =========================
   MENU ICON
========================= */

.menu-icon{
    width:76px;
    height:58px;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:38px;

    flex-shrink:0;

    margin-right:18px;

    box-shadow:
        inset 0 0 8px rgba(255,255,255,.65);
}


/* ICON BACKGROUNDS */

.malay-icon{
    background:#ffd9eb;
}

.english-icon{
    background:#c8c5ff;
}

.math-icon{
    background:#ffe29b;
}

.sudoku-icon{
    background:#bceff2;
}

.word-icon{
    background:#d9c0ff;
}

.crossword-icon{
    background:#c9ef9d;
}

.logout-icon{
    background:#ff9abb;
}


/* =========================
   MENU TEXT
========================= */

.menu-text{
    flex:1;

    color:#111b35;

    font-size:24px;
    font-weight:800;

    white-space:nowrap;
}


/* =========================
   ARROW
========================= */

.arrow{
    color:#ef4f9a;

    font-size:42px;
    font-weight:bold;

    line-height:1;

    margin-left:8px;
}


/* =========================
   LOG OUT
========================= */

.logout{
    width:70%;
    margin:2px auto 12px auto;

    border-color:#ff7fab;

    background:
        linear-gradient(
            135deg,
            #fff7fb,
            #ffffff
        );
}


/* =========================
   VERSION
========================= */

.version {
  margin-top: 14px;
  
  color: #5b32d6;
  
  font-size: 17px;
  font-weight: bold;
  
  background: none;
  padding: 0;
  
  border-radius: 0;
  
  box-shadow: none;
}

/* =========================
   HE BLOOM LOGO
========================= */

.he-bloom-logo{
    position:fixed;

    width:100px;
    height:100px;

    right:18px;
    bottom:18px;

    z-index:9999;

    opacity:.95;

    pointer-events:none;
}


/* =========================
   MOBILE
========================= */

@media(max-width:380px){

    h1{
        font-size:36px;
    }

    .menu-text{
        font-size:21px;
    }

    .menu-icon{
        width:65px;
        margin-right:14px;
    }

    .arrow{
        font-size:36px;
    }

}
/* =====================================================
   RESPONSIVE FINAL - ALL DEVICES
   PHONE + TABLET + COMPUTER
   PORTRAIT + LANDSCAPE

   MENU ASAL KEKAL
   HANYA SESUAIKAN DENGAN SKRIN
   ===================================================== */


/* ==============================
   ASAS SEMUA DEVICE
   ============================== */

html,
body {
    width: 100%;
    min-width: 0;
    max-width: 100%;
    overflow-x: hidden;
}

body {
    min-height: 100vh;
}


/* ==============================
   PHONE KECIL
   ============================== */

@media (max-width: 380px) {
    
    body {
        padding-left: 8px;
        padding-right: 8px;
    }
    
    .container {
        width: 100%;
        max-width: 380px;
        margin-left: auto;
        margin-right: auto;
        
        /*
         * Mengecilkan keseluruhan dashboard
         * secara berkadar supaya menu tidak
         * terkeluar daripada skrin.
         */
        zoom: calc(100vw / 380);
    }
    
    .menu {
        width: 100%;
    }
}


/* ==============================
   PHONE BESAR
   ============================== */

@media (min-width: 381px) and (max-width: 600px) {
    
    body {
        padding-left: 10px;
        padding-right: 10px;
    }
    
    .container {
        width: 100%;
        max-width: 380px;
        margin-left: auto;
        margin-right: auto;
    }
    
    .menu {
        width: 100%;
    }
}


/* ==============================
   PHONE LANDSCAPE
   ============================== */

@media (max-width: 900px) and (orientation: landscape) {
    
    body {
        padding-top: 10px;
        padding-bottom: 10px;
        
        overflow-x: hidden;
        overflow-y: auto;
    }
    
    .container {
        width: 100%;
        max-width: 380px;
        margin-left: auto;
        margin-right: auto;
    }
    
    .menu {
        width: 100%;
    }
}


/* ==============================
   COMPUTER / LAPTOP
   ============================== */

@media (min-width: 901px) {
    
    html,
    body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
    }
    
   .container {
    width: 100%;
    max-width: 380px;
    margin-left: auto;
    margin-right: auto;
}

.menu {
    width: 100%;
}

.logout {
    width: 70%;
}

}
/* ===== KEKALKAN LOG OUT SEPERTI ASAL ===== */

.logout {
    width: 70% !important;
    margin-left: auto !important;
    margin-right: auto !important;
}
</style>
</head>


<body>

<div class="container">


    <!-- =========================

    ========================== -->

    <h1>🌸 HE Bloom Edu Games</h1>


    <!-- =========================

    ========================== -->

    <div class="welcome">
        Welcome 👋
    </div>


    <!-- =========================

    ========================== -->

    <div class="menu"
         onclick="location.href='melayu.html'">

        </div>

        <div class="menu-text">

        </div>

        <div class="arrow">
            ›
        </div>

    </div>


    <!-- =========================

    ========================== -->

    <div class="menu"
         onclick="location.href='english.html'">

        <div class="menu-icon english-icon">

        </div>

        <div class="menu-text">

        </div>

        <div class="arrow">
            ›
        </div>

    </div>


    <!-- =========================
         MATHEMATICS
    ========================== -->

    <div class="menu"
         onclick="location.href='mathematics.html'">

        <div class="menu-icon math-icon">

        </div>

        <div class="menu-text">

        </div>

        <div class="arrow">
            ›
        </div>

    </div>


    <!-- =========================

    ========================== -->

    <div class="menu"
         onclick="location.href='sudoku.html'">

        <div class="menu-icon sudoku-icon">

        </div>

        <div class="menu-text">

        </div>

        <div class="arrow">

    </div>


    <!-- =========================

    ========================== -->

    <div class="menu"

        <div class="menu-icon word-icon">

        </div>

        <div class="menu-text">
            Word Search
        </div>

        <div class="arrow">
            ›
        </div>

    </div>


    <!-- =========================
         CROSSWORD
    ========================== -->

    <div class="menu"
         onclick="location.href='crossword.html'">

        <div class="menu-icon crossword-icon">

        </div>

        <div class="menu-text">

        </div>

        <div class="arrow">
            ›
        </div>

    </div>


    <!-- =========================
         LOG OUT
    ========================== -->

    <div class="menu logout"
         onclick="location.href='index.html'">

        <div class="menu-icon logout-icon">
            🔚
        </div>

        <div class="menu-text">
            Log Out
        </div>

    </div>


    <!-- =========================
         VERSION
    ========================== -->

    <div class="version">
        ♥ Versi 1.0 ♥
    </div>


</div>


<!-- =========================
     HE BLOOM LOGO
========================= -->

<img src="HE_Bloom.png"
     alt="HE Bloom"
     class="he-bloom-logo">


</body>
</html>
