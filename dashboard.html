<!DOCTYPE html>
<html lang="ms">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HE Bloom Edu Games</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body {
    background:
        linear-gradient(
            135deg,
            #f8efff 0%,
            #dfe9ff 45%,
            #d9f9ff 75%,
            #fff0f8 100%
        );

    min-height: 100dvh;

    padding: 25px 20px;

    margin: 0;

    position: relative;

    overflow-x: hidden;

    /* TENGAH ATAS & BAWAH */
    display: flex;
    justify-content: center;
    align-items: center;
}


.container {
    width: 100%;
    max-width: 380px;
    
    margin: 0 auto;
    
    text-align: center;
    
    transform: translateY(-140px) scale(1.20);
    transform-origin: top center;
}

/* =========================
   TAJUK
========================= */

h1 {
  color: #ff4fa3;
  
  text-align: center;
  
  font-size: 28px;
  font-weight: 900;
  
  line-height: 1.1;
  
  margin-top: 5px;
  margin-bottom: 18px;
  
  white-space: nowrap;
  
  text-shadow:
    2px 2px 0 #ffffff,
    -2px -2px 0 #ffffff,
    0 3px 0 #ffffff,
    0 5px 0 #62c9ff,
    0 8px 10px rgba(70, 150, 220, .45);
}
/* =========================
   WELCOME
========================= */

.welcome{
    display:inline-block;

    background:
        linear-gradient(
            135deg,
            #ff9dcc 0%,
            #ff72b5 50%,
            #8fd3ff 100%
        );

    color:white;

    font-size:23px;
    font-weight:800;

    padding:9px 45px;

    border-radius:35px;

    margin-bottom:28px;

    border:2px solid #ffffff;

    box-shadow:
        0 6px 15px rgba(255,120,190,.30),
        0 0 15px rgba(143,211,255,.30);

    text-shadow:
        1px 2px 2px rgba(120,60,120,.25);
}

/* =========================
   MAIN MENU
========================= */

.menu{
    width:100%;

    background:rgba(255,255,255,.97);

    min-height:78px;

    padding:12px 16px;

    margin-bottom:12px;

    border-radius:22px;

    border:3px solid #ff9dcc;

    box-shadow:
        0 5px 15px rgba(120,160,210,.15),
        0 0 12px rgba(255,130,190,.18);

    display:flex;

    align-items:center;

    text-align:left;

    cursor:pointer;

    transition:.2s;
}

.menu:hover{
    transform:scale(1.02);
}

.menu:active{
    transform:scale(.97);
}


/* =========================
   MENU ICON
========================= */

.menu-icon{
    width:76px;
    height:58px;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:38px;

    flex-shrink:0;

    margin-right:18px;

    box-shadow:
        inset 0 0 8px rgba(255,255,255,.65);
}


/* ICON BACKGROUNDS */

.malay-icon{
    background:#ffd9eb;
}

.english-icon{
    background:#c8c5ff;
}

.math-icon{
    background:#ffe29b;
}

.sudoku-icon{
    background:#bceff2;
}

.word-icon{
    background:#d9c0ff;
}

.crossword-icon{
    background:#c9ef9d;
}

.logout-icon{
    background:#ff9abb;
}


/* =========================
   MENU TEXT
========================= */

.menu-text{
    flex:1;

    color:#111b35;

    font-size:24px;
    font-weight:800;

    white-space:nowrap;
}


/* =========================
   ARROW
========================= */

.arrow{
    color:#ef4f9a;

    font-size:42px;
    font-weight:bold;

    line-height:1;

    margin-left:8px;
}


/* =========================
   LOG OUT
========================= */

.logout{
    width:70%;
    margin:2px auto 12px auto;

    border-color:#ff7fab;

    background:
        linear-gradient(
            135deg,
            #fff7fb,
            #ffffff
        );
}


/* =========================
   VERSION
========================= */

.version {
  margin-top: 14px;
  
  color: #5b32d6;
  
  font-size: 17px;
  font-weight: bold;
  
  background: none;
  padding: 0;
  
  border-radius: 0;
  
  box-shadow: none;
}

/* =========================
   HE BLOOM LOGO
========================= */

.he-bloom-logo{
    position:fixed;

    width:80px;
    height:80px;

    right:18px;
    bottom:18px;

    z-index:9999;

    opacity:.95;

    pointer-events:none;
}


@media (min-width: 768px) {
    .he-bloom-logo {
        width: 100px;
        height: 100px;
    }
}


/* =========================
   RESPONSIVE FINAL
   PHONE + TABLET + COMPUTER
========================= */

html,
body {
    width: 100%;
    min-width: 0;
    max-width: 100%;
    overflow-x: hidden;
}

body {
    min-height: 100vh;
}

/* =========================
   FIX MOBILE PHONE
========================= */

@media (max-width: 767px) {
    
    .container {
        width: 100%;
        max-width: 380px;
        margin: 0 auto;
        
        transform: translateY(-32px) scale(1);
        transform-origin: top center;
    }
    
    .menu {
        width: 100%;
        min-height: 64px;
        padding: 6px 12px;
        margin-bottom: 8px;
    }
    
    .menu-icon {
        width: 60px;
        height: 52px;
        margin-right: 12px;
        font-size: 32px;
    }
    
    .menu-text {
        font-size: 19px;
    }
    
    .arrow {
        font-size: 36px;
    }
    
    .logout {
        width: 80%;
    }
    
}




/* ===== KEKALKAN LOG OUT SEPERTI ASAL ===== */

.logout {
    width: 70% !important;
    margin-left: auto !important;
    margin-right: auto !important;
}


<style>
/* ===== DASHBOARD ===== */

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(
        135deg,
        #f8efff,
        #e8eaff,
        #dffaff
    );

    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* CONTAINER TENGAH */
.dashboard-container {
    width: min(92%, 850px);
    margin: 0 auto;
    padding: 35px 0 30px;

    display: flex;
    flex-direction: column;
    align-items: center;

    box-sizing: border-box;
}

/* TAJUK */
.dashboard-title {
    color: #ed4b9a;
    font-size: clamp(22px, 3vw, 34px);
    font-weight: bold;
    text-align: center;
    text-shadow: 2px 2px #b8edff;

    margin-bottom: 18px;
}

/* WELCOME */
.welcome-btn {
    width: min(280px, 80%);
    padding: 10px;

    border-radius: 30px;
    border: 2px solid white;

    background: linear-gradient(
        90deg,
        #f879b5,
        #e9a9d8,
        #a6d8ff
    );

    color: white;
    font-size: 22px;
    font-weight: bold;
    text-align: center;

    box-shadow: 0 4px 15px #e6a9df;
    margin-bottom: 28px;
}

/* MENU */
.dashboard-menu {
    width: 100%;
    max-width: 700px;

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
}

/* BUTTON */
.dashboard-menu button {
    width: 100%;
    min-height: 78px;

    display: flex;
    align-items: center;
    gap: 18px;

    padding: 12px 20px;

    background: rgba(255, 255, 255, 0.95);

    border: 3px solid #f29acb;
    border-radius: 22px;

    color: #17223f;
    font-size: clamp(18px, 2.5vw, 25px);
    font-weight: bold;

    box-sizing: border-box;
    cursor: pointer;

    box-shadow: 0 3px 10px rgba(240, 140, 205, 0.3);

    transition: transform 0.15s ease;
}

/* ICON */
.dashboard-menu button .icon {
    width: 62px;
    height: 55px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 14px;
    background: #fbd7e8;

    font-size: 32px;
}

/* TEXT */
.dashboard-menu button .text {
    flex: 1;
    text-align: left;
}

/* ARROW */
.dashboard-menu button .arrow {
    color: #e34899;
    font-size: 36px;
}

/* LOGOUT */
.logout-btn {
    width: 250px !important;
    margin-top: 10px;
    justify-content: center;
}

/* VERSI */
.version-text {
    margin-top: 18px;
    color: #6236b8;
    font-weight: bold;
    font-size: 16px;
}

/* RESPONSIVE PAD */
@media (min-width: 768px) {

    .dashboard-container {
        max-width: 850px;
        padding-top: 45px;
    }

    .dashboard-menu {
        max-width: 700px;
        gap: 16px;
    }

    .dashboard-menu button {
        min-height: 88px;
        padding: 14px 24px;
    }
}

/* =========================
   LANDSCAPE FIX
   TAJUK + WELCOME KELIHATAN
========================= */

@media (orientation: landscape) {
    
    html,
    body {
        width: 100%;
        min-height: 100%;
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
    }
    
    body {
        display: block;
        padding: 20px 12px;
    }
    
    .container {
        width: 100%;
        max-width: 380px;
        margin: 0 auto;
        
        transform: none !important;
        transform-origin: top center;
        text-align: center;
    }
    
    h1 {
        margin-top: 0;
        margin-bottom: 14px;
        font-size: 28px;
    }
    
    .welcome {
        margin-bottom: 20px;
    }
    
}
</style>

</style>
</head>
