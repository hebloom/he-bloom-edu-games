        const btnColors = [

        let questions = [], currentQ = 0, score = 0, answered = false;
            let firstTry = true;
        let audioCtx = null, musicOsc = null, musicPlaying = false;

        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function playCorrectSound() {
            const ctx = getAudioCtx();
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'sine'; o.frequency.setValueAtTime(523, ctx.currentTime);
            o.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
            o.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
            g.gain.setValueAtTime(0.3, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            o.start(); o.stop(ctx.currentTime + 0.4);
        }

        function playWrongSound() {
            const ctx = getAudioCtx();
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'sawtooth'; o.frequency.setValueAtTime(200, ctx.currentTime);
            o.frequency.setValueAtTime(150, ctx.currentTime + 0.2);
            g.gain.setValueAtTime(0.2, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            o.start(); o.stop(ctx.currentTime + 0.3);
        }
        
        function playClickSound() {
    const ctx = getAudioCtx();
    
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    
    o.frequency.value = 600;
    g.gain.value = 0.08;
    
    o.connect(g);
    g.connect(ctx.destination);
    
    o.start();
    o.stop(ctx.currentTime + 0.08);
}

        function toggleMusic() {
    
    playClickSound(); // bunyi klik setiap kali tekan
    
    const ctx = getAudioCtx();
    
    if (musicPlaying) {
        stopMusic();
        return;
    }
    
    musicPlaying = true;
    
    // Tekan pertama = music ON
    document.getElementById('music-btn').textContent = '🎵';
    
    playMusicLoop();
}
        let musicInterval;
        function playMusicLoop() {
            const ctx = getAudioCtx();
            const notes = [262,294,330,349,392,349,330,294];
            let i = 0;
            function playNote() {
                if (!musicPlaying) return;
                const o = ctx.createOscillator(); const g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.type = 'sine'; o.frequency.value = notes[i % notes.length];
                g.gain.setValueAtTime(0.08, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                o.start(); o.stop(ctx.currentTime + 0.4);
                i++;
            }
            playNote();
            musicInterval = setInterval(playNote, 500);
        }

        function stopMusic() {
            musicPlaying = false;
            clearInterval(musicInterval);
            document.getElementById('music-btn').textContent = '🔇 ';
        }

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

        function generateQuestions() {
    
    let allQuestions = [];
    
    // Setiap pasangan menghasilkan 2 soalan
    oppositePairs.forEach(pair => {
        
        allQuestions.push({
            word: pair[0],
            answer: pair[1]
        });
        
        allQuestions.push({
            word: pair[1],
            answer: pair[0]
        });
        
    });
    
    // Rawak semua soalan
    shuffle(allQuestions);
    
    // Ambil 40 soalan sahaja
    questions = allQuestions.slice(0, 40).map(q => {
        
        const wrongAnswers = shuffle(
            allQuestions
            .filter(x => x.answer !== q.answer)
            .map(x => x.answer)
        ).slice(0, 3);
        
        return {
            word: q.word,
            answer: q.answer,
            options: shuffle([
                q.answer,
                ...wrongAnswers
            ])
        };
        
    });
}

        function renderQuestion() {
    
    answered = false;
    firstTry = true;
    
    const q = questions[currentQ];
    
    // Paparkan perkataan
  document.getElementById("question-word").textContent = q.word.charAt(0).toUpperCase() + q.word.slice(1).toLowerCase();
    
    // Nombor soalan
    document.getElementById("q-num").textContent = currentQ + 1;
    
    // Markah
    document.getElementById("score-val").textContent = score;
    
    // Pilihan jawapan
    const container = document.getElementById("answers");
    container.innerHTML = "";
    
    q.options.forEach((opt, i) => {
        
        const btn = document.createElement("button");
        
        btn.className =
            `btn-answer ${btnColors[i]}
        w-full min-h-14 px-2 py-2
        text-white font-bold text-xl
        rounded-2xl shadow-md
        flex items-center justify-center text-center`;
        
        btn.style.boxShadow =
    "0 0 10px #ffffff, 0 0 20px rgba(255,255,255,0.8), 0 8px 15px rgba(0,0,0,0.25)";

btn.style.border = "3px solid #ffffff";
        
        btn.textContent = opt.charAt(0).toUpperCase() + opt.slice(1).toLowerCase();
        
        btn.onclick = () => checkAnswer(opt, q.answer, btn);
        
        container.appendChild(btn);
    });
}
        function checkAnswer(selected, correct, btn) {
            if (answered) return;
            if (selected === correct) {
                answered = true;
                if (firstTry) {
                   score++;
                }
                
                playCorrectSound();
                showFeedback('✅ BETUL 🎉', 'text-green-500');
                setTimeout(() => {
                    hideFeedback();
                    currentQ++;
                    if (currentQ >= 40) showEnd();
                    else renderQuestion();
                }, 1000);
            } else {
                firstTry = false;
                playWrongSound();
                btn.classList.add('shake');
                showFeedback('❌ CUBA LAGI', 'text-red-500');
                setTimeout(() => {
                    hideFeedback();
                    btn.classList.remove('shake');
                }, 800);
            }
        }

        function hideFeedback() {

        function restartGame() {
