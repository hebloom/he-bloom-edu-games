        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function playCorrectSound() {
            const ctx = getAudioCtx();
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'sine'; o.frequency.setValueAtTime(523, ctx.currentTime);
            o.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
            o.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
            g.gain.setValueAtTime(0.3, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            o.start(); o.stop(ctx.currentTime + 0.4);
        }

        function playWrongSound() {
            const ctx = getAudioCtx();
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'sawtooth'; o.frequency.setValueAtTime(200, ctx.currentTime);
            o.frequency.setValueAtTime(150, ctx.currentTime + 0.2);
            g.gain.setValueAtTime(0.2, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            o.start(); o.stop(ctx.currentTime + 0.3);
        }
        
        function playClickSound() {
    const ctx = getAudioCtx();
    
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    
    o.frequency.value = 600;
    g.gain.value = 0.08;
    
    o.connect(g);
    g.connect(ctx.destination);
    
    o.start();
    o.stop(ctx.currentTime + 0.08);
}

        function toggleMusic() {
    
    playClickSound(); // bunyi klik setiap kali tekan
    
    const ctx = getAudioCtx();
    
    if (musicPlaying) {
        stopMusic();
        return;
    }
    
    musicPlaying = true;
    
    // Tekan pertama = music ON
    document.getElementById('music-btn').textContent = '🎵';
    
    playMusicLoop();
}

        let musicInterval;
        function playMusicLoop() {
            const ctx = getAudioCtx();
            const notes = [262,294,330,349,392,349,330,294];
            let i = 0;
            function playNote() {
                if (!musicPlaying) return;
                const o = ctx.createOscillator(); const g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.type = 'sine'; o.frequency.value = notes[i % notes.length];
                g.gain.setValueAtTime(0.08, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                o.start(); o.stop(ctx.currentTime + 0.4);
                i++;
            }
            playNote();
            musicInterval = setInterval(playNote, 500);
        }

        function stopMusic() {
            musicPlaying = false;
            clearInterval(musicInterval);
            document.getElementById('music-btn').textContent = '🔇 ';
        }

        function generateQuestions() {
    // Ambil semua perkataan dan susun secara rawak
    const shuffledWords = shuffle(
    words.filter(word => word.length >= 3 && word.length <= 6)
);
    
    // Pilih 40 perkataan sahaja
    questions = shuffledWords.slice(0, 40).map(word => {
        // Susun huruf secara rawak
        let scrambled = "";
        do {
            scrambled = shuffle(word.split("")).join("");
        } while (scrambled === word);
        
        return {
            word: word,
            scrambled: scrambled
        };
    });
}
       function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generateWrongAnswers(correct) {
    const wrongs = new Set();

    while (wrongs.size < 3) {
        const w = Math.floor(Math.random() * 500) + 1; // 60 hingga 500
        if (w !== correct) wrongs.add(w);
    }

    return [...wrongs];
}

        function renderQuestion() {
    answered = false;
    firstTry = true;
    
    const q = questions[currentQ];
    
    // Paparkan huruf yang telah diacak
    const questionEl = document.getElementById('question-text');
questionEl.textContent = q.scrambled;
questionEl.style.letterSpacing = "1px";
    // Kecilkan tulisan jika perkataan terlalu panjang
    
    questionEl.className =
"w-full text-3xl font-bold text-gray-800 fade-in";
document.getElementById('q-num').textContent = currentQ + 1;

questionEl.style.textShadow =
    "-1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0 0 8px #fff, 0 0 15px rgba(255,255,255,0.9)";
document.getElementById('score-val').textContent = score;
    // Pilihan jawapan
    const wrongAnswers = shuffle(
        words.filter(w => w !== q.word)
    ).slice(0, 3);
    
    const options = shuffle([q.word, ...wrongAnswers]);
    
    const container = document.getElementById('answers');
    container.innerHTML = "";
    
    options.forEach((opt, i) => {
        const btn = document.createElement("button");
        
        btn.className =
    `btn-answer ${btnColors[i]} w-full text-white font-bold text-xl py-4 px-5 rounded-3xl shadow-md`;
        
        btn.style.boxShadow =
            "0 0 12px rgba(255,255,255,0.7), 0 6px 12px rgba(0,0,0,0.2)";
        
        btn.textContent = opt;
        
        btn.onclick = () => checkAnswer(opt, q.word, btn);
        
        container.appendChild(btn);
    });
}
        function checkAnswer(selected, correct, btn) {
            if (answered) return;
            if (selected === correct) {
                answered = true;
                if (firstTry) {
                   score++;
                }
                
                playCorrectSound();
                showFeedback('✅ BETUL 🎉', 'text-green-500');
                setTimeout(() => {
                    hideFeedback();
                    currentQ++;
                    if (currentQ >= 40) showEnd();
                    else renderQuestion();
                }, 1000);
            } else {
                firstTry = false;
                playWrongSound();
                btn.classList.add('shake');
                showFeedback('❌ CUBA LAGI', 'text-red-500');
                setTimeout(() => {
                    hideFeedback();
                    btn.classList.remove('shake');
                }, 800);
            }
        }

function showFeedback(text, cls) {

    ">
        ${text.replace('\n','<br>')}

    fb.classList.remove('hidden');
}

            document.getElementById('feedback').classList.add('hidden');

} else if (score >= 30) {
    msg = "👏 SYABAS";
} else if (score >= 24) {
    msg = "😊 TERUS BERUSAHA";
} else {
    msg = "❤️ JANGAN PUTUS ASA";
}
            document.getElementById('final-msg').textContent = msg;
        }

        function restartGame() {
            score = 0; currentQ = 0;
            generateQuestions();
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('game-card').classList.remove('hidden');
            renderQuestion();
        }

        generateQuestions();
        renderQuestion();
    </script>
