        const animals = [

    { name: "Fish", emoji: "🐟" },
    { name: "Octopus", emoji: "🐙" },
    { name: "Whale", emoji: "🐋" },
    { name: "Dolphin", emoji: "🐬" },
    { name: "Crab", emoji: "🦀" },
    { name: "Butterfly", emoji: "🦋" }
];
        const btnColors = [
            "bg-pink-500 hover:bg-pink-500",
            "bg-blue-500 hover:bg-blue-500",
            "bg-green-500 hover:bg-green-500",
            "bg-orange-500 hover:bg-orange-500"
        ];

        let questions = [], currentQ = 0, score = 0, answered = false;
            let firstTry = true;
        let audioCtx = null, musicOsc = null, musicPlaying = false;

        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function playCorrectSound() {
            const ctx = getAudioCtx();
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'sine'; o.frequency.setValueAtTime(523, ctx.currentTime);
            o.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
            o.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
            g.gain.setValueAtTime(0.3, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            o.start(); o.stop(ctx.currentTime + 0.4);
        }

        function playWrongSound() {
            const ctx = getAudioCtx();
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'sawtooth'; o.frequency.setValueAtTime(200, ctx.currentTime);
            o.frequency.setValueAtTime(150, ctx.currentTime + 0.2);
            g.gain.setValueAtTime(0.2, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            o.start(); o.stop(ctx.currentTime + 0.3);
        }
        
        function playClickSound() {
    const ctx = getAudioCtx();
    
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    
    o.frequency.value = 600;
    g.gain.value = 0.08;
    
    o.connect(g);
    g.connect(ctx.destination);
    
    o.start();
    o.stop(ctx.currentTime + 0.08);
}

        function toggleMusic() {
    
    playClickSound(); // bunyi klik setiap kali tekan
    
    const ctx = getAudioCtx();
    
    if (musicPlaying) {
        stopMusic();
        return;
    }
    
    musicPlaying = true;
    
    // Tekan pertama = music ON
    document.getElementById('music-btn').textContent = '🎵';
    
    playMusicLoop();
}

        let musicInterval;
        function playMusicLoop() {
            const ctx = getAudioCtx();
            const notes = [262,294,330,349,392,349,330,294];
            let i = 0;
            function playNote() {
                if (!musicPlaying) return;
                const o = ctx.createOscillator(); const g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.type = 'sine'; o.frequency.value = notes[i % notes.length];
                g.gain.setValueAtTime(0.08, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                o.start(); o.stop(ctx.currentTime + 0.4);
                i++;
            }
            playNote();
            musicInterval = setInterval(playNote, 500);
        }

        function stopMusic() {
            musicPlaying = false;
            clearInterval(musicInterval);
            document.getElementById('music-btn').textContent = '🔇 ';
        }

        function generateQuestions() {
    const qs = new Set();

    while (qs.size < 40) {
        const answer = Math.floor(Math.random() * 4501) + 500; // Jawapan 500-5000
        const num1 = Math.floor(Math.random() * (answer + 1)); // 0 hingga jawapan
        const num2 = answer - num1;

        const key = `${num1}+${num2}`;

        if (!qs.has(key)) {
            qs.add(key);
        }
    }

    questions = [...qs].map(k => {
        const [a, b] = k.split('+').map(Number);
        return {
            num1: a,
            num2: b,
            answer: a + b
        };
    });
}
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generateWrongAnswers(correct) {
    const wrongs = new Set();

    while (wrongs.size < 3) {
        const w = Math.floor(Math.random() * 4501) + 500;

        if (w !== correct) {
            wrongs.add(w);
        }
    }

    return [...wrongs];
}

        function renderQuestion() {
            answered = false;
            firstTry = true;
            const q = questions[currentQ];
            document.getElementById('question-text').textContent =
`${q.num1} + ${q.num2} = ?`;
            document.getElementById('question-text').className = 'text-4xl sm:text-5xl font-bold text-gray-800 fade-in';
            document.getElementById('q-num').textContent = currentQ + 1;
            document.getElementById('score-val').textContent = score;

            const wrongAnswers = generateWrongAnswers(q.answer);
            const options = shuffle([q.answer, ...wrongAnswers]);
            const usedAnimals = shuffle([...animals]).slice(0, 4);
  
            const container = document.getElementById('answers');
            container.innerHTML = '';
            options.forEach((opt, i) => {
                const btn = document.createElement('button');
btn.className = `btn-answer ${btnColors[i]} w-full text-white font-bold text-2xl py-2 rounded-2xl shadow-md flex items-center justify-center` ;

btn.style.boxShadow =
    "0 0 0 3px rgba(255,255,255,0.85), 0 0 15px rgba(255,255,255,0.55), 0 8px 18px rgba(0,0,0,0.20)";

btn.innerHTML = `
<span class="flex items-center justify-center gap-2">
    ${opt} ${usedAnimals[i].name} <span class="text-3xl">${usedAnimals[i].emoji}</span>
</span>`;
                btn.onclick = () => checkAnswer(opt, q.answer, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct, btn) {
            if (answered) return;
            if (selected === correct) {
                answered = true;
                if (firstTry) {
                   score++;
                }
                
                playCorrectSound();
                showFeedback('✅ TRUE 🎉', 'text-green-500');
                setTimeout(() => {
                    hideFeedback();
                    currentQ++;
                    if (currentQ >= 40) showEnd();
                    else renderQuestion();
                }, 1000);
            } else {
                firstTry = false;
                playWrongSound();
                btn.classList.add('shake');
                showFeedback('❌ TRY AGAIN', 'text-red-500');
                setTimeout(() => {
                    hideFeedback();
                    btn.classList.remove('shake');
                }, 800);
            }
        }

function showFeedback(text, cls) {
    const fb = document.getElementById('feedback');
    const ft = document.getElementById('feedback-text');

    ft.innerHTML = `
    <div style="
        background:#ffffff;
        border:4px solid ${cls.includes('green') ? '#22c55e' : '#ef4444'};
        border-radius:20px;
        padding:15px 25px;
        display:inline-block;
        box-shadow:0 8px 20px rgba(0,0,0,0.35);
        font-size:30px;
        font-weight:900;
        color:${cls.includes('green') ? '#22c55e' : '#ef4444'};
    ">
        ${text.replace('\n','<br>')}
    </div>`;

    fb.classList.remove('hidden');
}

        function hideFeedback() {
            document.getElementById('feedback').classList.add('hidden');
        }

        function showEnd() {
            document.getElementById('game-card').classList.add('hidden');
            const end = document.getElementById('end-screen');
            end.classList.remove('hidden');
            document.getElementById('final-score').textContent = `${score} / 40`;
             let msg = '';
            if (score >= 36) msg = '🏆 Awesome!';
            else if (score >= 30) msg = '👏 GOOD JOB';
            else if (score >= 24) msg = '💪 KEEP PRACTICING';
            else msg = '❤️ DON\'T GIVE UP';
            document.getElementById('final-msg').textContent = msg;
        }

        function restartGame() {
            score = 0; currentQ = 0;
            generateQuestions();
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('game-card').classList.remove('hidden');
            renderQuestion();
        }

        generateQuestions();
        renderQuestion();
    </script>
