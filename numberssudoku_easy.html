<script>
let audioCtx = null;
let musicInterval = null;
let musicPlaying = false;

function getAudioCtx() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
if (audioCtx.state === "suspended") {
audioCtx.resume();
}
return audioCtx;
} 

function playClickSound() {
    const ctx = getAudioCtx();
    
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    osc.frequency.value = 600;
    gain.gain.value = 0.08;
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    
    osc.start();
    osc.stop(ctx.currentTime + 0.08);
}

function toggleMusic() {
    const ctx = getAudioCtx();
    
    if (musicPlaying) {
        stopMusic();
        return;
    }
    
    musicPlaying = true;
    document.getElementById("music-btn").textContent = "🎵";
    playMusicLoop();
}

function playMusicLoop() {
    const ctx = getAudioCtx();
    
    const notes = [262, 294, 330, 349, 392, 349, 330, 294];
    let i = 0;
    
    function playNote() {
        if (!musicPlaying) return;
        
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        
        o.connect(g);
        g.connect(ctx.destination);
        
        o.type = "sine";
        o.frequency.value = notes[i % notes.length];
        
        g.gain.setValueAtTime(0.08, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(
            0.01,
            ctx.currentTime + 0.4
        );
        
        o.start();
        o.stop(ctx.currentTime + 0.4);
        
        i++;
    }
    
    playNote();
    musicInterval = setInterval(playNote, 500);
}

function stopMusic() {
    musicPlaying = false;
    
    clearInterval(musicInterval);
    
    document.getElementById("music-btn").textContent = "🔇";
}


function playCorrectSound() {
    const ctx = getAudioCtx();
    
    const notes = [523, 659, 784];
    
    notes.forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        
        o.connect(g);
        g.connect(ctx.destination);
        
        o.type = "sine";
        o.frequency.value = freq;
        
        g.gain.setValueAtTime(0.001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(
            0.08,
            ctx.currentTime + 0.03
        );
        g.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + 0.25
        );
        
        o.start(ctx.currentTime + i * 0.12);
        o.stop(ctx.currentTime + i * 0.12 + 0.25);
    });
}

function playWrongSound() {
    const ctx = getAudioCtx();
    
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    
    o.connect(g);
    g.connect(ctx.destination);
    
    o.type = "sawtooth";
    o.frequency.value = 180;
    
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(
        0.08,
        ctx.currentTime + 0.03
    );
    g.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 0.4
    );
    
    o.start();
    o.stop(ctx.currentTime + 0.4);
}

let sudokuQuestions = [];

function generateRandomSudoku() {
    
    // 4 nombor untuk Number Sudoku
    const numbers = [1, 2, 3, 4];
    
    const base = [
        0, 1, 2, 3,
        2, 3, 0, 1,
        1, 0, 3, 2,
        3, 2, 1, 0
    ];
    
    // Acak susunan nombor 1, 2, 3, 4
    const shuffledNumbers = [...numbers]
        .sort(() => Math.random() - 0.5);
    
    // Sudoku lengkap
    const solution = base.map(n => shuffledNumbers[n]);
    
    // Salin untuk petak permainan
    const grid = [...solution];
    
    // 4 atau 5 petak kosong
    const emptyCount =
        Math.floor(Math.random() * 2) + 4;
    
    // Pilih lokasi kosong secara rawak
    const positions = [...Array(16).keys()]
        .sort(() => Math.random() - 0.5);
    
    for (let i = 0; i < emptyCount; i++) {
        grid[positions[i]] = null;
    }
    
    return {
        grid: grid,
        initialGrid: [...grid],
        solution: solution
    };
}

function generateQuestions() {
    
    sudokuQuestions = [];
    
    // 10 round
    for (let i = 0; i < 10; i++) {
        sudokuQuestions.push(
            generateRandomSudoku()
        );
    }
}

    current.grid.forEach((number, index) => {
        
        const button = document.createElement("button");
        
        button.dataset.index = index;
        
        if (number !== null) {
            
            button.innerHTML =
                `<span class="text-[44px] font-extrabold text-purple-700">
                ${number}
            </span>`;
            
        } else {
            
            // Petak kosong
            button.classList.add("empty-cell");
            
        }
        
        grid.appendChild(button);
    });
}

function updateTimer() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;

    document.getElementById("timer").textContent =
        `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
}


function startTimer() {
    updateTimer();

    timerInterval = setInterval(() => {

        if (gameFinished) return;

        timeLeft--;

        if (timeLeft <= 0) {
            timeLeft = 0;
            updateTimer();
            finishGame(true);
            return;
        }

        updateTimer();

    }, 1000);
}

        const saveResult = () => {
            
            const name =
                window.firebasePlayerName;
            
            const uid =
                window.firebasePlayerUid;
            
            console.log(
                "Cuba simpan leaderboard:",
                name,
                uid
            );
            
            if (
                !name ||
                name === "Unknown Player" ||
                !uid
            ) {
                console.log(
                    "⏳ Nama Firebase belum siap, cuba lagi..."
                );
                
                setTimeout(saveResult, 500);
                return;
            }
            
            if (!window.saveSudokuResult) {
                
                console.error(
                    "❌ saveSudokuResult tidak tersedia."
                );
                
                return;
            }
            
            window.saveSudokuResult(
                    name,
                    "numbers",
                    "easy",
                    elapsed,
                    uid
                )
                .then(() => {
                    
                    console.log(
                        "✅ NAMA BERJAYA DISIMPAN:",
                        name
                    );
                    
                })
                .catch((error) => {
                    
                    console.error(
                        "❌ Gagal simpan leaderboard:",
                        error
                    );
                    
                });
            
        };
        
        saveResult();
    }
    
    
    // =========================
    // PAPAR END SCREEN
    // =========================
    
    const endScreen =
        document.getElementById("end-screen");
    
    const finalScore =
        document.getElementById("final-score");
    
    const finalMsg =
        document.getElementById("final-msg");
    
    
    finalScore.textContent =
        `${score} / 10`;
    
    
    if (timeUp) {
        
        finalMsg.innerHTML =
            "⏰ TIME'S UP<br>❤️ DON'T GIVE UP";
        
    } else if (
        score === 10 &&
        elapsed <= 10 * 60
    ) {
        
        finalMsg.textContent =
            "🏆 EXCELLENT";
        
    } else if (
        score === 10 &&
        elapsed > 10 * 60
    ) {
        
        finalMsg.textContent =
            "👍 GREAT JOB";
        
    } else {
        
        finalMsg.textContent =
            "💪 DON'T GIVE UP";
    }
    
    
    endScreen.classList.remove("hidden");
}

function nextRound() {

    // Round 10 selesai = tamat game
    if (currentQuestion >= sudokuQuestions.length - 1) {
        finishGame(false);
        return;
    }

    currentQuestion++;

    answerLocked = false;
    selectedCell = null;

    renderSudokuGrid();
    setupSudokuCells();

highlightNextEmptyCell();

    document.getElementById("question-number").textContent =
        `${currentQuestion + 1} / ${sudokuQuestions.length}`;
}</script>

function checkSudokuAnswer(grid) {
    
    // SEMAK MELINTANG
    for (let row = 0; row < 4; row++) {
        
        const rowNumbers =
            grid.slice(row * 4, row * 4 + 4);
        
        if (new Set(rowNumbers).size !== 4) {
            return false;
        }
    }
    
    // SEMAK MENEGAK
    for (let col = 0; col < 4; col++) {
        
        const colNumbers = [];
        
        for (let row = 0; row < 4; row++) {
            
            colNumbers.push(
                grid[row * 4 + col]
            );
        }
        
        if (new Set(colNumbers).size !== 4) {
            return false;
        }
    }
    
    return true;
}

    });
    
    if (nextEmptyIndex !== -1) {
    
    const targetCell = cells[nextEmptyIndex];
    
    selectedCell = targetCell;
    
    targetCell.style.boxShadow =
        "inset 0 0 0 4px #f06b91, 0 0 12px rgba(240,107,145,0.45)";
    
    targetCell.style.background = "#fff5f8";
}
}



let selectedCell = null;
function setupSudokuCells() {
    
    sudokuCells = document.querySelectorAll("#sudoku-grid button");
    
    const current = sudokuQuestions[currentQuestion];
    
    sudokuCells.forEach(cell => {
        
        cell.addEventListener("click", function() {
            
            const index = Number(this.dataset.index);
            
            // WARNA ASAL TIDAK BOLEH DIPILIH
            if (current.initialGrid[index] !== null) {
                selectedCell = null;
                return;
            }
            
            // Buang highlight kotak lain
            sudokuCells.forEach(c => {
                c.style.boxShadow = "";
                c.style.background =
                    "rgba(255, 255, 255, 0.72)";
            });
            
            // Pilih kotak kosong / warna yang pemain isi
            selectedCell = this;
            
            this.style.boxShadow =
                "inset 0 0 0 4px #f06b91, 0 0 12px rgba(240,107,145,0.45)";
            
            this.style.background = "#fff5f8";
            
        });
        
    });
}
