<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crossword | HE Bloom Edu Games</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #f8fbff 48%,
            #fff3f9 100%
        );

    padding:30px;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
}

/* TIADA bulatan besar di penjuru */
body::before,
body::after{
    content:none;
}

.container{
    max-width:360px;
    margin:auto;
}

h1 {
    color: #d92f87;
    text-align: center;
    font-size: 44px;
    font-weight: 900;
    white-space: nowrap;

    width: 100%;
    margin: 2px auto 0 auto;

    text-shadow:
        3px 3px 0 #ffffff,
        -2px -2px 0 #ffffff,
        0 5px 8px rgba(217, 47, 135, 0.45),
        0 8px 14px rgba(255, 120, 190, 0.25);
}

.subtitle {
    text-align: center;
    color: #5b32d6;
    font-size: 25px;
    font-weight: 800;
    white-space: nowrap;

    text-shadow:
        2px 2px 0 #ffffff,
        -2px -2px 0 #ffffff,
        0 4px 7px rgba(91, 50, 214, 0.40),
        0 7px 12px rgba(120, 90, 230, 0.20);

    margin-top: 15px;
    margin-bottom: 35px;
}

.card {
    background: rgba(255, 255, 255, .96);
    padding: 20px;
    margin-bottom: 8px;
    border-radius: 20px;

    border: 3px solid #ff9dcc;

    box-shadow:
        0 5px 15px rgba(120, 160, 210, .15),
        0 0 12px rgba(255, 130, 190, .20);

    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;

    display: flex;
    align-items: center;
    justify-content: flex-start;

    gap: 12px;
    white-space: nowrap;
}

.icon {
    width: 45px;
    text-align: center;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
}

.card:hover{
    transform:scale(1.02);
}

.back{
    background: linear-gradient(
        135deg,
        #ffffff 0%,
        #ffd6eb 25%,
        #ff8fc7 55%,
        #8fd3ff 100%
    );

    color:white;
    text-align:center;

    width:50%;

    margin:20px auto;

    border:3px solid #ffffff;
    border-radius:20px;

    box-shadow:
        0 6px 16px rgba(255,120,190,.30),
        0 0 18px rgba(120,190,255,.35);

    font-size:25px;
    font-weight:bold;

    text-shadow:
        1px 1px 2px rgba(80,100,180,.35);

    transition:.2s;

    justify-content:center;
}

.back:active{
    transform:scale(.95);

    box-shadow:
        0 3px 8px rgba(255,100,180,.25),
        0 0 12px rgba(255,140,200,.35);
}

.he-bloom-logo {
    position: fixed;
    width: 110px;
    height: 110px;
    z-index: 9999;
    opacity: .95;
    pointer-events: none;
}

.bottom-logo {
    bottom: 18px;
    right: 18px;
}

/* =====================================================
   RESPONSIVE - MENU CROSSWORD
   SEMUA DEVICE
   TIDAK MENGUBAH ISI / FUNGSI
   ===================================================== */

/* ASAS - SEMUA DEVICE */
html,
body {
    width: 100%;
    min-height: 100%;
}

.container {
    width: 100%;
    max-width: 360px;
    margin: 0 auto;
}


/* =====================================================
   TABLET
   ===================================================== */

@media (max-width: 768px) {
    
    .container {
        width: 100%;
        max-width: 360px;
    }
    
    /* CARD MENU SAHAJA */
    .card:not(.back) {
        width: 100%;
    }
}


/* =====================================================
   TELEFON PORTRAIT
   RUPA ASAL DIKEKALKAN
   ===================================================== */

@media (max-width: 480px) and (orientation: portrait) {
    
    .container {
        width: 100%;
        max-width: 360px;
    }
    
    /* CARD MENU SAHAJA
       BACK KEKAL 50% */
    .card:not(.back) {
        width: 100%;
    }
    
    .back {
        width: 50% !important;
    }
}


/* =====================================================
   TELEFON LANDSCAPE
   ===================================================== */

@media (max-width: 900px) and (orientation: landscape) {
    
    body {
        padding: 10px !important;
    }
    
    .container {
        width: min(360px, calc(100vw - 20px)) !important;
        max-width: 360px !important;
        margin: 0 auto !important;
    }
    
    h1 {
        font-size: 36px !important;
        margin-top: 0 !important;
    }
    
    .subtitle {
        font-size: 21px !important;
        margin-top: 10px !important;
        margin-bottom: 20px !important;
    }
    
    /* CARD MENU SAHAJA */
    .card:not(.back) {
        width: 100% !important;
        padding: 15px 18px !important;
        margin-bottom: 7px !important;
        font-size: 18px !important;
    }
    
    .icon {
        width: 40px !important;
    }
    
    .back {
        width: 45% !important;
        font-size: 21px !important;
        margin: 15px auto !important;
    }
}


/* =====================================================
   SKRIN SANGAT KECIL - LANDSCAPE
   ===================================================== */

@media (max-width: 600px) and (orientation: landscape) {
    
    body {
        padding: 8px !important;
    }
    
    .container {
        width: min(340px, calc(100vw - 16px)) !important;
        max-width: 340px !important;
    }
    
    h1 {
        font-size: 32px !important;
    }
    
    .subtitle {
        font-size: 19px !important;
        margin-bottom: 16px !important;
    }
    
    .card:not(.back) {
        padding: 12px 15px !important;
        font-size: 16px !important;
    }
    
    .icon {
        width: 36px !important;
    }
    
    .back {
        width: 40% !important;
        font-size: 19px !important;
    }
}


/* =====================================================
   SKRIN BESAR
   ===================================================== */

@media (min-width: 1200px) {
    
    .container {
        max-width: 360px;
    }
}


/* =====================================================
   LOGO
   KEKAL SAIZ ASAL
   ===================================================== */

.he-bloom-logo {
    width: 110px !important;
    height: 110px !important;
}
</style>
</head>

<body>

<div class="container">

<h1>Crossword</h1>

<p class="subtitle">Choose Crossword Type</p>

<div class="card"
onclick="location.href='cw_animals.html'">
    <span class="icon">🐱</span>
    <span>Animals</span>
</div>

<div class="card"
onclick="location.href='cw_fruits.html'">
    <span class="icon">🍎</span>
    <span>Fruits</span>
</div>


<div class="card"
onclick="location.href='cw_vegetables.html'">
    <span class="icon">🥕</span>
    <span>Vegetables</span>
</div>

<div class="card"
onclick="location.href='cw_seaanimals.html'">
    <span class="icon">🐠</span>
    <span>Sea Animals</span>
</div>

<div class="card"
onclick="location.href='cw_math.html'">
    <span class="icon">🔢</span>
    <span>Math</span>
</div>

<div class="card"
onclick="location.href='cw_presentpast.html'">
    <span class="icon">📓</span>
    <span>Present to Past</span>
</div>

<div class="card back"
onclick="location.href='dashboard.html'">
    ⬅️ Back
</div>

</div>
<!-- HE BLOOM LOGO -->

<img src="HE_Bloom.png"
     alt="HE Bloom"
     class="he-bloom-logo bottom-logo">
</style>
</body>
</html>
