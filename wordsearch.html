<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Word Search | HE Bloom Edu Games</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #f8fbff 48%,
            #fff3f9 100%
        );

    padding:30px;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
}

/* TIADA bulatan besar di penjuru */
body::before,
body::after{
    content:none;
}

.container {
    transform: translateY(30px);
}
/* =========================
   TAJUK
========================= */

h1 {
    color: #d92f87;
    text-align: center;
    font-size: 36px;
    font-weight: 900;
    white-space: nowrap;
    
    width: 100%;
    position: relative;
    margin: 2px auto 0 auto;

    text-shadow:
        3px 3px 0 #ffffff,
        -2px -2px 0 #ffffff,
        0 5px 8px rgba(217, 47, 135, 0.45),
        0 8px 14px rgba(255, 120, 190, 0.25);
}


/* =========================
   SUBTITLE
========================= */

.subtitle {
    text-align: center;
    color: #5b32d6;
    font-size: 25px;
    font-weight: 800;
    white-space: nowrap;

    margin-top: 15px;
    margin-bottom: 35px;

    text-shadow:
        2px 2px 0 #ffffff,
        -2px -2px 0 #ffffff,
        0 4px 7px rgba(91, 50, 214, 0.40),
        0 7px 12px rgba(120, 90, 230, 0.20);
}


/* =========================
   MENU CARD
========================= */

.card{
    background:rgba(255,255,255,.96);

    padding:20px;
    margin-bottom:8px;

    border-radius:20px;
    border:3px solid #ff9dcc;

    box-shadow:
        0 5px 15px rgba(120,160,210,.15),
        0 0 12px rgba(255,130,190,.20);

    font-size: 22px;
    font-weight:bold;

    cursor:pointer;
    transition:.2s;

    display:flex;
    align-items:center;
    justify-content:flex-start;

    gap:12px;
    white-space:nowrap;
}

.card:hover{
    transform:scale(1.02);
}


/* =========================
   ICON
========================= */

.card .icon{
    width:45px;

    text-align:center;

    display:inline-flex;
    justify-content:center;
    align-items:center;

    flex-shrink:0;
}


/* =========================
   BACK BUTTON
========================= */

.back{
    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #ffd6eb 25%,
            #ff8fc7 55%,
            #8fd3ff 100%
        );

    color:white;

    text-align:center;

    width:50%;

    margin:20px auto;

    border:3px solid #ffffff;
    border-radius:20px;

    box-shadow:
        0 6px 16px rgba(255,120,190,.30),
        0 0 18px rgba(120,190,255,.35);

    font-size:25px;
    font-weight:bold;

    text-shadow:
        1px 1px 2px rgba(80,100,180,.35);

    transition:.2s;

    justify-content:center;
}

.back:active{
    transform:scale(.95);

    box-shadow:
        0 3px 8px rgba(255,100,180,.25),
        0 0 12px rgba(255,140,200,.35);
}


/* =========================
   HE BLOOM LOGO
========================= */

.he-bloom-logo {
    position: fixed;
    width: 100px;
    height: 100px;
    z-index: 9999;
    opacity: .95;
    pointer-events: none;
}

.bottom-logo {
    bottom: 18px;
    right: 18px;
}

/* =========================
   KHAS PAD / TABLET
   WORD SEARCH
========================= */

@media (min-width: 768px) {
    
    .container {
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
        transform: translateY(100px);
    }
    
    /* TAJUK */
    h1 {
        width: 100%;
        font-size: 48px;
        margin-bottom: 30px;
    }
    
    /* SUBTITLE */
    .subtitle {
        font-size: 34px;
        margin-bottom: 38px;
    }
    
    /* MENU */
    .card {
        width: 82%;
        min-height: 90px;
        margin: 0 auto 14px auto;
        padding: 18px 25px;
        
        font-size: 28px;
        
        justify-content: flex-start;
        text-align: left;
    }
    
    /* EMOJI KEKAL */
    .card .icon {
        display: inline-flex;
        width: 55px;
        min-width: 55px;
        font-size: 34px;
    }
    
.back {
    width: 40%;
    min-height: 70px;
    margin: 28px auto;
    font-size: 28px;
    
    align-items: center;
    justify-content: center;
    text-align: center;
}

</style>
</head>


<body>

<div class="container">

    <h1>Word Search</h1>

    <p class="subtitle">Choose Word Search Type</p>


    <!-- ANIMALS -->

    <div class="card"
         onclick="location.href='ws_animals.html'">

        <span class="icon">🐱</span>
        <span>Animals</span>

    </div>


    <!-- FRUITS -->

    <div class="card"
         onclick="location.href='ws_fruits.html'">

        <span class="icon">🍎</span>
        <span>Fruits</span>

    </div>


    <!-- SEA ANIMALS -->

    <div class="card"
         onclick="location.href='wordsearch_seaanimals.html'">

        <span class="icon">🐠</span>
        <span>Sea Animals</span>

    </div>


    <!-- VEGETABLES -->

    <div class="card"
         onclick="location.href='wordsearch_vegetables.html'">

        <span class="icon">🥕</span>
        <span>Vegetables</span>

    </div>


    <!-- OBJECTS -->

    <div class="card"
         onclick="location.href='ws_objects.html'">

        <span class="icon">⚽</span>
        <span>Objects</span>

    </div>


    <!-- PRESENT TO PAST -->

    <div class="card"
         onclick="location.href='ws_presentpast.html'">

        <span class="icon">📓</span>
        <span>Present to Past</span>

    </div>


    <!-- BACK -->

    <div class="card back"
         onclick="location.href='dashboard.html'">

        ⬅️ Back

    </div>

</div>


<!-- HE BLOOM LOGO -->

<img src="HE_Bloom.png"
     alt="HE Bloom"
     class="he-bloom-logo bottom-logo">

</body>
</html>
