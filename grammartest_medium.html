/* =====================================================
   RESPONSIVE LANDSCAPE - GRAMMAR TEST EASY
   PORTRAIT KEKAL SEPERTI ASAL
   ===================================================== */

@media (orientation: landscape) {
    
    html,
    body {
        width: 100%;
        min-width: 0;
        overflow-x: hidden;
        overflow-y: auto;
    }
    
    
    /* ==============================================
       GAME CARD
       ============================================== */
    
    #game-card {
        width: 90% !important;
        max-width: 700px !important;
        
        height: auto !important;
        min-height: 90vh !important;
        
        box-sizing: border-box !important;
        
        overflow: visible !important;
    }
    
    
    /* ==============================================
       QUESTION + SCORE
       PENDEK SIKIT TAPI KEKAL DI ATAS
       ============================================== */
    
    #game-card>div.flex.items-center.justify-between {
        
        width: calc(100% - 30px) !important;
        max-width: calc(100% - 30px) !important;
        
        margin-left: auto !important;
        margin-right: auto !important;
        
        position: relative !important;
        
        top: 0 !important;
        left: 0 !important;
        
        transform: none !important;
        
        box-sizing: border-box !important;
    }
    
    
    /* ==============================================
       QUESTION BOX
       ============================================== */
    
    .question-box {
        width: 100% !important;
        max-width: 100% !important;
        
        box-sizing: border-box !important;
    }
    
    
    /* ==============================================
       RUANG JAWAPAN
       ============================================== */
    
    #game-card>div:has(.btn-answer) {
        
        width: 100% !important;
        max-width: 100% !important;
        
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        
        gap: 12px !important;
        
        box-sizing: border-box !important;
    }
    
    
    /* ==============================================
       BUTTON JAWAPAN
       ============================================== */
    
    .btn-answer {
        
        width: 100% !important;
        max-width: 100% !important;
        
        flex: none !important;
        
        box-sizing: border-box !important;
    }
    
}
/* =========================================
   RESPONSIVE SAFE
   ALL DEVICE - PORTRAIT + LANDSCAPE
   ========================================= */

html,
body {
    max-width: 100%;
    overflow-x: hidden;
}

/* Skrin pendek - termasuk landscape phone */
@media (max-height: 600px) {
    
    body {
        overflow-y: auto !important;
        overflow-x: hidden !important;
    }
    
    #game-card {
        height: auto !important;
        min-height: 0 !important;
    }
}

/* HP kecil */
@media (max-width: 480px) {
    
    #game-card {
        max-width: 700px;
        box-sizing: border-box;
    }
    
    #question-text {
        overflow-wrap: break-word;
    }
    
    #answers .btn-answer {
        max-width: 100%;
        box-sizing: border-box;
    }
}

/* Tablet / iPad / laptop / komputer */
@media (min-width: 481px) {
    
    #game-card {
        box-sizing: border-box;
        max-width: 700px;
    }
    
    #answers .btn-answer {
        box-sizing: border-box;
        max-width: 100%;
    }
}
/* FIX SEMUA MODE - PAD PORTRAIT SAHAJA */

@media (orientation: portrait) and (min-width: 600px) {
    
    #answers {
        display: grid !important;
        grid-template-columns: minmax(0, 1fr) !important;
        gap: 16px !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 auto !important;
    }
    
    #answers .btn-answer {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box !important;
        white-space: normal !important;
        overflow-wrap: break-word !important;
    }
}

        const btnColors = [
            "bg-pink-500 hover:bg-pink-500",
            "bg-blue-500 hover:bg-blue-500",
            "bg-orange-500 hover:bg-orange-500"
        ];

        let questions = [], currentQ = 0, score = 0, answered = false;
            let firstTry = true;
        let audioCtx = null, musicOsc = null, musicPlaying = false;

        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function playCorrectSound() {
            const ctx = getAudioCtx();
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'sine'; o.frequency.setValueAtTime(523, ctx.currentTime);
            o.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
            o.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
            g.gain.setValueAtTime(0.3, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            o.start(); o.stop(ctx.currentTime + 0.4);
        }

        function playWrongSound() {
            const ctx = getAudioCtx();
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'sawtooth'; o.frequency.setValueAtTime(200, ctx.currentTime);
            o.frequency.setValueAtTime(150, ctx.currentTime + 0.2);
            g.gain.setValueAtTime(0.2, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            o.start(); o.stop(ctx.currentTime + 0.3);
        }
        
        function playClickSound() {
    const ctx = getAudioCtx();
    
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    
    o.frequency.value = 600;
    g.gain.value = 0.08;
    
    o.connect(g);
    g.connect(ctx.destination);
    
    o.start();
    o.stop(ctx.currentTime + 0.08);
}

        function toggleMusic() {
    
    playClickSound(); // bunyi klik setiap kali tekan
    
    const ctx = getAudioCtx();
    
    if (musicPlaying) {
        stopMusic();
        return;
    }
    
    musicPlaying = true;
    
    // Tekan pertama = music ON
    document.getElementById('music-btn').textContent = '🎵';
    
    playMusicLoop();
}

        let musicInterval;
        function playMusicLoop() {
            const ctx = getAudioCtx();
            const notes = [262,294,330,349,392,349,330,294];
            let i = 0;
            function playNote() {
                if (!musicPlaying) return;
                const o = ctx.createOscillator(); const g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.type = 'sine'; o.frequency.value = notes[i % notes.length];
                g.gain.setValueAtTime(0.08, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                o.start(); o.stop(ctx.currentTime + 0.4);
                i++;
            }
            playNote();
            musicInterval = setInterval(playNote, 500);
        }

        function stopMusic() {
            musicPlaying = false;
            clearInterval(musicInterval);
            document.getElementById('music-btn').textContent = '🔇 ';
        }

        function generateQuestions() {
    // Kacau semua soalan
    const shuffled = shuffle([...allQuestions]);
    
    // Ambil 15 soalan secara rawak
    questions = shuffled.slice(0, 15);
}

       function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        
        function renderQuestion() {
    answered = false;
    firstTry = true;
    
    const q = questions[currentQ];
    const questionEl = document.getElementById('question-text');
    
    // Paparkan soalan dengan garisan kosong
    questionEl.innerHTML = q.question.replace(
        "[BLANK]",
        "<span class='blank-line'></span>"
    );
    
    questionEl.style.letterSpacing = "0px";
    
    questionEl.className =
        "w-full text-2xl font-bold text-gray-800 fade-in";
    
    document.getElementById('q-num').textContent = currentQ + 1;
    document.getElementById('score-val').textContent = score;
    
    questionEl.style.textShadow =
        "-1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff";
    
    // Pilihan jawapan
    const options = shuffle([...q.answers]);
    
    const container = document.getElementById('answers');
    container.innerHTML = "";
    
    options.forEach((opt, i) => {
        const btn = document.createElement("button");
        
        btn.className =
    `btn-answer ${btnColors[i]} w-[100%] text-white font-bold text-2xl py-3 px-4 rounded-3xl shadow-md`;
    
        btn.style.boxShadow =
            "0 0 12px rgba(255,255,255,0.7), 0 6px 12px rgba(0,0,0,0.2)";
        
        btn.textContent = opt;
        
        btn.onclick = () => checkAnswer(opt, q.correct, btn);
        
        container.appendChild(btn);
    });
}
        function checkAnswer(selected, correct, btn) {
            if (answered) return;
            if (selected === correct) {
                answered = true;
                if (firstTry) {
                   score++;
                }
                
                playCorrectSound();
                showFeedback('✅ TRUE 🎉', 'text-green-500');
                setTimeout(() => {
                    hideFeedback();
                    currentQ++;
                    if (currentQ >= 15) showEnd();
                    else renderQuestion();
                }, 1000);
            } else {
                firstTry = false;
                playWrongSound();
                btn.classList.add('shake');
                showFeedback('❌ TRY AGAIN ', 'text-red-500');
                setTimeout(() => {
                    hideFeedback();
                    btn.classList.remove('shake');
                }, 800);
            }
        }

function showFeedback(text, cls) {
    const fb = document.getElementById('feedback');
    const ft = document.getElementById('feedback-text');

    ft.innerHTML = `
    <div style="
        background:#ffffff;
        border:4px solid ${cls.includes('green') ? '#22c55e' : '#ef4444'};
        border-radius:20px;
        padding:15px 25px;
        display:inline-block;
        box-shadow:0 8px 20px rgba(0,0,0,0.35);
        font-size:30px;
        font-weight:900;
        color:${cls.includes('green') ? '#22c55e' : '#ef4444'};
    ">
        ${text.replace('\n','<br>')}
    </div>`;

    fb.classList.remove('hidden');
}

        function hideFeedback() {
            document.getElementById('feedback').classList.add('hidden');
        }

        function showEnd() {
            document.getElementById('game-card').classList.add('hidden');
            const end = document.getElementById('end-screen');
            end.classList.remove('hidden');
            document.getElementById('final-score').textContent = `${score} / 15`;
          let msg = '';
            if (score >= 14) {
    msg = "🏆 EXCELLENT";
} else if (score >= 11) {
    msg = "👏 GREAT JOB";
} else if (score >= 8) {
    msg = "😊 KEEP GOING";
} else {
    msg = "❤️ DON'T GIVE UP";
}

            document.getElementById('final-msg').textContent = msg;
        }

        function restartGame() {
            score = 0; currentQ = 0;
            generateQuestions();
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('game-card').classList.remove('hidden');
            renderQuestion();
        }

        generateQuestions();
        renderQuestion();
