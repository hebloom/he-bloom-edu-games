* {

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-10px);
    }
}

@keyframes floatSlow {
    0%,100% {
        transform: translateY(0) rotate(0deg);
    }
    50% {
        transform: translateY(-6px) rotate(2deg);
    }
}

@keyframes birdFly {
    0% {
        transform: translateX(-120px) translateY(0px) rotate(-6deg);
    }
    15% {
        transform: translateX(15vw) translateY(-18px) rotate(4deg);
    }
    30% {
        transform: translateX(30vw) translateY(8px) rotate(-3deg);
    }
    45% {
        transform: translateX(45vw) translateY(-22px) rotate(5deg);
    }
    60% {
        transform: translateX(60vw) translateY(12px) rotate(-4deg);
    }
    75% {
        transform: translateX(80vw) translateY(-15px) rotate(3deg);
    }
    90% {
        transform: translateX(95vw) translateY(6px) rotate(-2deg);
    }
    100% {
        transform: translateX(110vw) translateY(-10px) rotate(2deg);
    }
}

@keyframes beeFly {
    0%,100% {
        transform: translate(0,0);
    }
    25% {
        transform: translate(30px,-20px);
    }
    50% {
        transform: translate(-10px,-30px);
    }
    75% {
        transform: translate(20px,10px);
    }
}

@keyframes sway {
    0%,100% {
        transform: rotate(-2deg);
    }
    50% {
        transform: rotate(2deg);
    }
}

@keyframes sunPulse {
    0%,100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.05);
    }
}

@keyframes zoomIn {
    0% {
        transform: scale(0.5);
        opacity: 0;
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

@keyframes shake {
    0%,100% {
        transform: translateX(0);
    }
    20% {
        transform: translateX(-8px);
    }
    40% {
        transform: translateX(8px);
    }
    60% {
        transform: translateX(-5px);
    }
    80% {
        transform: translateX(5px);
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

<script>

/* ===== SOUND & MUSIC ===== */

let audioCtx = null;
let musicInterval = null;
let musicPlaying = false;

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new(
      window.AudioContext || window.webkitAudioContext
    )();
  }
  
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
  
  return audioCtx;
}

function playClickSound() {
  const ctx = getAudioCtx();
  
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  
  osc.frequency.value = 600;
  gain.gain.value = 0.08;
  
  osc.connect(gain);
  gain.connect(ctx.destination);
  
  osc.start();
  osc.stop(ctx.currentTime + 0.08);
}


/* ===== MUSIC ===== */

function toggleMusic() {
  getAudioCtx();
  
  if (musicPlaying) {
    stopMusic();
    return;
  }
  
  musicPlaying = true;
  document.getElementById("music-btn").textContent = "🎵";
  
  playMusicLoop();
}

function playMusicLoop() {
  const ctx = getAudioCtx();
  
  const notes = [262, 294, 330, 349, 392, 349, 330, 294];
  let i = 0;
  
  function playNote() {
    if (!musicPlaying) return;
    
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    
    o.connect(g);
    g.connect(ctx.destination);
    
    o.type = "sine";
    o.frequency.value = notes[i % notes.length];
    
    g.gain.setValueAtTime(0.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(
      0.01,
      ctx.currentTime + 0.4
    );
    
    o.start();
    o.stop(ctx.currentTime + 0.4);
    
    i++;
  }
  
  playNote();
  musicInterval = setInterval(playNote, 500);
}

function stopMusic() {
  musicPlaying = false;
  
  clearInterval(musicInterval);
  
  document.getElementById("music-btn").textContent = "🔇";
}


/* ===== CORRECT SOUND ===== */

function playCorrectSound() {
  const ctx = getAudioCtx();
  
  const notes = [523, 659, 784];
  
  notes.forEach((freq, i) => {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    
    o.connect(g);
    g.connect(ctx.destination);
    
    o.type = "sine";
    o.frequency.value = freq;
    
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(
      0.08,
      ctx.currentTime + 0.03
    );
    g.gain.exponentialRampToValueAtTime(
      0.001,
      ctx.currentTime + 0.25
    );
    
    o.start(ctx.currentTime + i * 0.12);
    o.stop(ctx.currentTime + i * 0.12 + 0.25);
  });
}


/* ===== WRONG SOUND ===== */

function playWrongSound() {
  const ctx = getAudioCtx();
  
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  
  o.connect(g);
  g.connect(ctx.destination);
  
  o.type = "sawtooth";
  o.frequency.value = 180;
  
  g.gain.setValueAtTime(0.001, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(
    0.08,
    ctx.currentTime + 0.03
  );
  g.gain.exponentialRampToValueAtTime(
    0.001,
    ctx.currentTime + 0.4
  );
  
  o.start();
  o.stop(ctx.currentTime + 0.4);
}


/* ===== GAME VARIABLES ===== */

let selectedCell = null;
let currentPuzzleIndex = 0;
let completedPuzzles = 0;

let lastGameMath = [];

const totalPuzzles = 14;

/* ===== 14 SOALAN MATH CROSSWORD ===== */

const crosswordWords = [
  ["16", "÷", "4", "=", "4"],
  ["2", "×", "3", "=", "6"],
  ["2", "+", "3", "=", "5"],
  ["4", "×", "3", "=", "12"],
  ["4", "+", "5", "=", "9"],
  ["9", "+", "6", "=", "15"],
  ["42", "÷", "6", "=", "7"],
  ["25", "-", "10", "=", "15"],
  ["3", "+", "2", "=", "5"],
  ["6", "÷", "2", "=", "3"],
  ["8", "+", "4", "=", "12"],
  ["7", "-", "2", "=", "5"],
  ["10", "-", "5", "=", "5"],
  ["9", "÷", "3", "=", "3"]
];



function renderCrosswordGrid() {

    const grid = document.getElementById("crossword-grid");
    grid.innerHTML = "";

    /* ================================
       SAIZ PETAK
    ================================ */

    const CELL = 32;


    /* ==========================================
       BENTUK CROSSWORD
       [column, row]
    ========================================== */

    const CELLS = [

        /* ===== ATAS KIRI ===== */
        [0,0],[1,0],[2,0],[3,0],[4,0],

        [2,1],        [4,1],

        [0,2],[1,2],[2,2],[3,2],[4,2],

        [0,3],        [2,3],        [4,3],

        [0,4],        [2,4],        [4,4],

        [0,5],

        [0,6],


        /* ===== TENGAH ATAS ===== */
        [6,2],

        [6,3],

        [5,4],[6,4],[7,4],

        [6,5],


        /* ===== ATAS KANAN ===== */
        [8,0],
        [8,1],
        [8,2],
        [8,3],
        [8,4],


        /* ===== KUMPULAN BAWAH ===== */
        [2,6],[3,6],[4,6],[5,6],[6,6],

        [2,7],        [4,7],

// ===== RANDOM NUMBER =====
function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}


// ===== CHECK EQUATION =====
function isValidEquation(a, op, b, c) {

  if (
    !Number.isInteger(a) ||
    !Number.isInteger(b) ||
    !Number.isInteger(c)
  ) return false;

  if (a < 1 || b < 1 || c < 1) return false;

  if (a > MAX_ANSWER ||
      b > MAX_ANSWER ||
      c > MAX_ANSWER) return false;

  if (op === "+") return a + b === c;

  if (op === "−") return a - b === c;

  if (op === "×") return a * b === c;

  if (op === "÷") return b !== 0 && a / b === c;

  return false;
}


// ===== BUAT EQUATION IKUT NOMBOR YANG SUDAH BERSILANG =====
function createEquation(known) {
  
  const ops = ["+", "−", "×", "÷"];
  
  for (let attempt = 0; attempt < 5000; attempt++) {
    
    const op = ops[randomInt(0, ops.length - 1)];
    
    let a = known[0];
    let b = known[2];
    let c = known[4];
    
    
    // ===== TIADA NOMBOR TETAP =====
    if (a === undefined && b === undefined && c === undefined) {
      
      if (op === "+") {
        a = randomInt(1, 250);
        b = randomInt(1, 500 - a);
        c = a + b;
      }
      
      else if (op === "−") {
        a = randomInt(2, 500);
        b = randomInt(1, a - 1);
        c = a - b;
      }
      
      else if (op === "×") {
        a = randomInt(1, 25);
        b = randomInt(1, Math.floor(500 / a));
        c = a * b;
      }
      
      else if (op === "÷") {
        b = randomInt(2, 20);
        c = randomInt(1, Math.floor(500 / b));
        a = b * c;
      }
    }
    
    
    // ===== A SAHAJA TETAP =====
    else if (a !== undefined && b === undefined && c === undefined) {
      
      if (op === "+") {
        if (a >= 500) continue;
        b = randomInt(1, 500 - a);
        c = a + b;
      }
      
      else if (op === "−") {
        if (a <= 1) continue;
        b = randomInt(1, a - 1);
        c = a - b;
      }
      
      else if (op === "×") {
        if (a > 500) continue;
        b = randomInt(1, Math.floor(500 / a));
        c = a * b;
      }
      
      else if (op === "÷") {
        const divisors = [];
        
        for (let x = 2; x <= a; x++) {
          if (a % x === 0) divisors.push(x);
        }
        
        if (divisors.length === 0) continue;
        
        b = divisors[randomInt(0, divisors.length - 1)];
        c = a / b;
      }
    }
    
    
    // ===== B SAHAJA TETAP =====
    else if (a === undefined && b !== undefined && c === undefined) {
      
      if (op === "+") {
        if (b >= 500) continue;
        a = randomInt(1, 500 - b);
        c = a + b;
      }
      
      else if (op === "−") {
        if (b >= 500) continue;
        a = randomInt(b + 1, 500);
        c = a - b;
      }
      
      else if (op === "×") {
        a = randomInt(1, Math.floor(500 / b));
        c = a * b;
      }
      
      else if (op === "÷") {
        c = randomInt(1, Math.floor(500 / b));
        a = b * c;
      }
    }
    
    
    // ===== C SAHAJA TETAP =====
    else if (a === undefined && b === undefined && c !== undefined) {
      
      if (op === "+") {
        if (c < 2) continue;
        a = randomInt(1, c - 1);
        b = c - a;
      }
      
      else if (op === "−") {
        if (c >= 500) continue;
        b = randomInt(1, 500 - c);
        a = b + c;
      }
      
      else if (op === "×") {
        const factors = [];
        
        for (let x = 1; x <= c; x++) {
          if (c % x === 0) factors.push(x);
        }
        
        if (factors.length === 0) continue;
        
        a = factors[randomInt(0, factors.length - 1)];
        b = c / a;
      }
      
      else if (op === "÷") {
        b = randomInt(2, Math.floor(500 / c));
        a = b * c;
      }
    }
    
    
    // ===== A DAN B TETAP =====
    else if (a !== undefined && b !== undefined && c === undefined) {
      
      if (op === "+") {
        c = a + b;
      }
      
      else if (op === "−") {
        if (a <= b) continue;
        c = a - b;
      }
      
      else if (op === "×") {
        c = a * b;
      }
      
      else if (op === "÷") {
        if (b === 0 || a % b !== 0) continue;
        c = a / b;
      }
    }
    
    
    // ===== A DAN C TETAP =====
    else if (a !== undefined && b === undefined && c !== undefined) {
      
      if (op === "+") {
        b = c - a;
      }
      
      else if (op === "−") {
        b = a - c;
      }
      
      else if (op === "×") {
        if (a === 0 || c % a !== 0) continue;
        b = c / a;
      }
      
      else if (op === "÷") {
        if (c === 0 || a % c !== 0) continue;
        b = a / c;
      }
    }
    
    
    // ===== B DAN C TETAP =====
    else if (a === undefined && b !== undefined && c !== undefined) {
      
      if (op === "+") {
        a = c - b;
      }
      
      else if (op === "−") {
        a = b + c;
      }
      
      else if (op === "×") {
        if (b === 0 || c % b !== 0) continue;
        a = c / b;
      }
      
      else if (op === "÷") {
        a = b * c;
      }
    }
    
    
    // ===== SEMUA NOMBOR TETAP =====
    else {
      if (!isValidEquation(a, op, b, c)) continue;
    }
    
    
    // ===== CHECK AKHIR =====
    if (isValidEquation(a, op, b, c)) {
      
      return [
        String(a),
        op,
        String(b),
        "=",
        String(c)
      ];
    }
  }
  
  
// Tiada equation sesuai untuk nombor persilangan ini
return null;
}


// ===== JANA 14 SOALAN YANG BERSAMBUNG =====
function generateRandomCrossword() {
  
  // Cuba buat keseluruhan puzzle
  for (let puzzleAttempt = 0; puzzleAttempt < 100; puzzleAttempt++) {
    
    const cellValues = {};
    let success = true;
    
    
    // Buang math lama dahulu
    CROSSWORD_LINES.forEach(line => {
      line.math = null;
    });
    
    
    // Buat 14 soalan satu demi satu
    for (const line of CROSSWORD_LINES) {
      
      const known = {};
      
      
      // Ambil nombor yang SUDAH ADA pada kotak bersilang
      [0, 2, 4].forEach(index => {
        
        const pos = line.cells[index];
        const key = pos[0] + "," + pos[1];
        
        if (cellValues[key] !== undefined) {
          known[index] = cellValues[key];
        }
        
      });
      
      
      // Buat equation ikut nombor persilangan
      const math = createEquation(known);
      
      
      // Kalau tiada equation sesuai, mula semula seluruh puzzle
      if (!math) {
        success = false;
        break;
      }
      
      
      // CHECK: Jangan benarkan nombor lama ditukar
      let valid = true;
      
      [0, 2, 4].forEach(index => {
        
        const pos = line.cells[index];
        const key = pos[0] + "," + pos[1];
        const newValue = Number(math[index]);
        
        if (
          cellValues[key] !== undefined &&
          cellValues[key] !== newValue
        ) {
          valid = false;
        }
        
      });
      
      
      // Jika nombor persilangan berubah, mula semula puzzle
      if (!valid) {
        success = false;
        break;
      }
      
      
      // Simpan equation
      line.math = math;
      
      
      // Simpan nombor HANYA jika kotak belum ada nombor
      [0, 2, 4].forEach(index => {
        
        const pos = line.cells[index];
        const key = pos[0] + "," + pos[1];
        
        if (cellValues[key] === undefined) {
          cellValues[key] = Number(math[index]);
        }
        
      });
      
    }
    
    
    // Kalau semua 14 berjaya, siap
    if (success) {
      return;
    }
    
  }
  
  
  console.log("Tidak dapat jana crossword yang sesuai.");
}
