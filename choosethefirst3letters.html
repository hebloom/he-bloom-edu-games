        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function playCorrectSound() {
            const ctx = getAudioCtx();
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'sine'; o.frequency.setValueAtTime(523, ctx.currentTime);
            o.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
            o.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
            g.gain.setValueAtTime(0.3, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            o.start(); o.stop(ctx.currentTime + 0.4);
        }

        function playWrongSound() {
            const ctx = getAudioCtx();
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'sawtooth'; o.frequency.setValueAtTime(200, ctx.currentTime);
            o.frequency.setValueAtTime(150, ctx.currentTime + 0.2);
            g.gain.setValueAtTime(0.2, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            o.start(); o.stop(ctx.currentTime + 0.3);
        }

function playClickSound() {
    const ctx = getAudioCtx();
    
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    
    o.frequency.value = 600;
    g.gain.value = 0.08;
    
    o.connect(g);
    g.connect(ctx.destination);
    
    o.start();
    o.stop(ctx.currentTime + 0.08);
}

        function toggleMusic() {
    
    playClickSound(); // bunyi klik setiap kali tekan
    
    const ctx = getAudioCtx();
    
    if (musicPlaying) {
        stopMusic();
        return;
    }
    
    musicPlaying = true;
    
    // Tekan pertama = music ON
    document.getElementById('music-btn').textContent = '🎵';
    
    playMusicLoop();
}

        let musicInterval;
        function playMusicLoop() {
            const ctx = getAudioCtx();
            const notes = [262,294,330,349,392,349,330,294];
            let i = 0;
            function playNote() {
                if (!musicPlaying) return;
                const o = ctx.createOscillator(); const g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.type = 'sine'; o.frequency.value = notes[i % notes.length];
                g.gain.setValueAtTime(0.08, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                o.start(); o.stop(ctx.currentTime + 0.4);
                i++;
            }
            playNote();
            musicInterval = setInterval(playNote, 500);
        }

        function stopMusic() {
            musicPlaying = false;
            clearInterval(musicInterval);
            document.getElementById('music-btn').textContent = '🔇 ';
        }

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

        function generateQuestions() {
    // Rawakkan semua data
    const shuffledWords = shuffle([...words]);
    
    // Ambil 40 soalan sahaja (tanpa ulangan)
    questions = shuffledWords.slice(0, 40).map(item => {
        
        // Jawapan betul
        const correct = item.word;
        
        // Ambil 3 jawapan salah secara rawak
        const wrongAnswers = shuffle(
            words
            .filter(w => w.word !== correct)
            .map(w => w.word)
        ).slice(0, 3);
        
        // Campurkan semua pilihan
        const options = shuffle([
            correct,
            ...wrongAnswers
        ]);
        
        return {
            word: item.word,
            image: item.image,
            options: options,
            answer: correct
        };
    });
}

const correct = q.word.substring(0, 3).toUpperCase();

// Semua pilihan bermula dengan 2 huruf pertama
const prefix = correct.substring(0, 2);

const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

const wrongAnswers = [];

const vowels = ["A", "E", "I", "O", "U"];
const consonants = alphabet.filter(l => !vowels.includes(l));

while (wrongAnswers.length < 3) {
    
    // 50% guna vokal, 50% guna konsonan
    const randomLast =
        Math.random() < 0.5 ?
        vowels[Math.floor(Math.random() * vowels.length)] :
        consonants[Math.floor(Math.random() * consonants.length)];
    
    const fake = prefix + randomLast;
    
    if (fake !== correct && !wrongAnswers.includes(fake)) {
        wrongAnswers.push(fake);
    }
}

const options = shuffle([
    correct,
    ...wrongAnswers
]);

        btn.onclick = () => checkAnswer(opt, correct, btn);
        
        container.appendChild(btn);
    });
}
        function checkAnswer(selected, correct, btn) {
            if (answered) return;
            if (selected === correct) {
                answered = true;
                if (firstTry) {
                   score++;
                }
                
                playCorrectSound();
                showFeedback('✅ TRUE 🎉', 'text-green-500');
                setTimeout(() => {
                    hideFeedback();
                    currentQ++;
                    if (currentQ >= 40) showEnd();
                    else renderQuestion();
                }, 1000);
            } else {
                firstTry = false;
                playWrongSound();
                btn.classList.add('shake');
                showFeedback('❌ TRY AGAIN ', 'text-red-500');
                setTimeout(() => {
                    hideFeedback();
                    btn.classList.remove('shake');
                }, 800);
            }
        }
