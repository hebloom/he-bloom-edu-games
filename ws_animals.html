<script>
let audioCtx = null;
let musicInterval = null;
let musicPlaying = false;

function getAudioCtx() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
if (audioCtx.state === "suspended") {
audioCtx.resume();
}
return audioCtx;
} 

function playClickSound() {
    const ctx = getAudioCtx();
    
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    osc.frequency.value = 600;
    gain.gain.value = 0.08;
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    
    osc.start();
    osc.stop(ctx.currentTime + 0.08);
}

function toggleMusic() {
    const ctx = getAudioCtx();
    
    if (musicPlaying) {
        stopMusic();
        return;
    }
    
    musicPlaying = true;
    document.getElementById("music-btn").textContent = "🎵";
    playMusicLoop();
}

function playMusicLoop() {
    const ctx = getAudioCtx();
    
    const notes = [262, 294, 330, 349, 392, 349, 330, 294];
    let i = 0;
    
    function playNote() {
        if (!musicPlaying) return;
        
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        
        o.connect(g);
        g.connect(ctx.destination);
        
        o.type = "sine";
        o.frequency.value = notes[i % notes.length];
        
        g.gain.setValueAtTime(0.08, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(
            0.01,
            ctx.currentTime + 0.4
        );
        
        o.start();
        o.stop(ctx.currentTime + 0.4);
        
        i++;
    }
    
    playNote();
    musicInterval = setInterval(playNote, 500);
}

function stopMusic() {
    musicPlaying = false;
    
    clearInterval(musicInterval);
    
    document.getElementById("music-btn").textContent = "🔇";
}


function playCorrectSound() {
    const ctx = getAudioCtx();
    
    const notes = [523, 659, 784];
    
    notes.forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        
        o.connect(g);
        g.connect(ctx.destination);
        
        o.type = "sine";
        o.frequency.value = freq;
        
        g.gain.setValueAtTime(0.001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(
            0.08,
            ctx.currentTime + 0.03
        );
        g.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + 0.25
        );
        
        o.start(ctx.currentTime + i * 0.12);
        o.stop(ctx.currentTime + i * 0.12 + 0.25);
    });
}

function playWrongSound() {
    const ctx = getAudioCtx();
    
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    
    o.connect(g);
    g.connect(ctx.destination);
    
    o.type = "sawtooth";
    o.frequency.value = 180;
    
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(
        0.08,
        ctx.currentTime + 0.03
    );
    g.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 0.4
    );
    
    o.start();
    o.stop(ctx.currentTime + 0.4);
}

const animalWords = [
  "ANT", "BADGER", "BAT", "BEAR", "BEE", "BUTTERFLY", "CAMEL",
  "CAT", "CATERPILLAR", "CHICKEN", "COCKROACH", "COW", "CRICKET",
  "CROW", "DEER", "DOG", "DUCK", "EAGLE", "ELEPHANT", "FALCON",
  "FLAMINGO", "FLY", "FOX", "FROG", "GIRAFFE", "GOAT", "GORILLA",
  "GRASSHOPPER", "HEDGEHOG", "HORSE", "HUMMINGBIRD", "KANGAROO",
  "KOALA", "LADYBUG", "LION", "LIZARD", "MAGGOT", "MONKEY",
  "MOSQUITO", "OSTRICH", "OWL", "PANDA", "PARROT", "PEACOCK",
  "PIGEON", "RABBIT", "RACCOON", "SEAGULL", "SHEEP", "SNAKE",
  "SQUIRREL", "TIGER", "WOODPECKER", "WORM", "ZEBRA"
];

let wordSearchWords = [];

// Queue haiwan untuk satu pusingan penuh
let animalQueue = [];

// Simpan 10 haiwan game sebelum ini
let lastGameAnimals = [];


function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    
    return array;
}


function makeNewAnimalQueue() {

    // Ambil semua haiwan
    let newQueue = [...animalWords];

    // Shuffle dulu
    shuffleArray(newQueue);

    // Jangan bagi haiwan game terakhir muncul
    // di awal pusingan baru
    const safeAnimals = newQueue.filter(
        animal => !lastGameAnimals.includes(animal)
    );

    const repeatedAnimals = newQueue.filter(
        animal => lastGameAnimals.includes(animal)
    );

    // Haiwan baru/berbeza di depan
    // Haiwan game lama di belakang
    animalQueue = [
        ...safeAnimals,
        ...repeatedAnimals
    ];
}


function chooseAnimals() {

    wordSearchWords = [];

    // Kalau belum ada queue, mula pusingan baru
    if (animalQueue.length === 0) {
        makeNewAnimalQueue();
    }

    // Ambil 10 haiwan
    while (wordSearchWords.length < 10) {

        // Kalau pusingan lama habis
        if (animalQueue.length === 0) {
            makeNewAnimalQueue();
        }

        const animal = animalQueue.shift();

// Elak nama sama dalam game yang sama
if (!wordSearchWords.includes(animal)) {
    wordSearchWords.push(animal);
}
    }

    // Simpan game ini
    lastGameAnimals = [...wordSearchWords];
}

function generateQuestions() {
  chooseAnimals();
}



generateQuestions();
renderWordSearchGrid();

function restartWordSearch() {
    document.getElementById("end-screen").classList.add("hidden");
    document.getElementById("feedback").classList.add("hidden");
    
    
    
    generateQuestions();
    renderWordSearchGrid();
}



function renderWordSearchGrid() {
    
    const grid = document.getElementById("word-search-grid");
    const wordList = document.getElementById("words-to-find");

    grid.innerHTML = "";
    wordList.innerHTML = "";

    wordSearchSelection = [];
    wordSearchFound = [];
    wordSearchPlaced = [];

    const SIZE = 12;

    // =====================================
    // BUAT GRID KOSONG
    // =====================================

    let cells = Array.from(
        { length: SIZE },
        () => Array(SIZE).fill("")
    );

    // =====================================
    // LETAK 10 NAMA HAIWAN
    // =====================================

    const words = [...wordSearchWords]
    .map(word => word.toUpperCase());

    function canPlaceWord(word, row, col, direction) {

        for (let i = 0; i < word.length; i++) {

            const r =
  direction === "across" ? row :
  direction === "down" ? row + i :
  direction === "diagDown" ? row + i :
  row - i;

const c =
  direction === "across" ? col + i :
  direction === "down" ? col :
  direction === "diagDown" ? col + i :
  col + i;
  
            // Keluar grid
            if (
                r < 0 ||
                r >= SIZE ||
                c < 0 ||
                c >= SIZE
            ) {
                return false;
            }

            // Ada huruf lain yang tidak sama
            if (
                cells[r][c] !== "" &&
                cells[r][c] !== word[i]
            ) {
                return false;
            }
        }

        return true;
    }

    function placeWord(word) {

        let placed = false;
        let attempts = 0;

        while (!placed && attempts < 500) {

            attempts++;

            const directions = [
  "across",
  "down",
  "diagDown",
  "diagUp"
];

const direction =
  directions[Math.floor(Math.random() * directions.length)];

            const row =
                Math.floor(Math.random() * SIZE);

            const col =
                Math.floor(Math.random() * SIZE);

            if (
                !canPlaceWord(
                    word,
                    row,
                    col,
                    direction
                )
            ) {
                continue;
            }

            const positions = [];

            for (
                let i = 0;
                i < word.length;
                i++
            ) {

                const r =
  direction === "across" ? row :
  direction === "down" ? row + i :
  direction === "diagDown" ? row + i :
  row - i;

                const c =
  direction === "across" ? col + i :
  direction === "down" ? col :
  direction === "diagDown" ? col + i :
  col + i;

                cells[r][c] = word[i];

                positions.push({
                    row: r,
                    col: c
                });
            }

            wordSearchPlaced.push({
                word: word,
                positions: positions
            });

            placed = true;
        }

        return placed;
    }

    // Letak semua 10 word
    for (const word of words) {

        const success =
            placeWord(word);

        // Kalau gagal, buat semula game
        if (!success) {

            generateQuestions();
            renderWordSearchGrid();
            return;
        }
    }

    // =====================================
    // ISI HURUF RAWAK
    // =====================================

    const alphabet =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    for (
        let r = 0;
        r < SIZE;
        r++
    ) {

        for (
            let c = 0;
            c < SIZE;
            c++
        ) {

            if (cells[r][c] === "") {

                cells[r][c] =
                    alphabet[
                        Math.floor(
                            Math.random() *
                            alphabet.length
                        )
                    ];
            }
        }
    }

    // =====================================
    // SAIZ GRID
    // =====================================

    const cellSize = 27;

    grid.style.gridTemplateColumns =
        `repeat(${SIZE}, ${cellSize}px)`;

    grid.style.gridTemplateRows =
        `repeat(${SIZE}, ${cellSize}px)`;

    grid.style.gap = "2px";

    grid.style.setProperty(
        "--cell-size",
        `${cellSize}px`
    );

    grid.style.setProperty(
        "--cell-font-size",
        "15px"
    );

    // =====================================
    // PAPAR SENARAI WORD
    // =====================================

    words.forEach(word => {

        const item =
            document.createElement("div");

        item.textContent = word;
        
item.style.fontSize = "12px";

        item.dataset.word = word;

        item.className =
            "word-search-item";

        item.style.padding =
            "2px 1px";

        item.style.border =
            "2px solid #f3a6bb";

        item.style.borderRadius =
            "10px";

        item.style.background =
            "rgba(255,255,255,0.9)";

        wordList.appendChild(item);
        
        item.addEventListener("click", function() {
  playClickSound();
  highlightWordFromList(word);
});
    });

    // =====================================
    // LUKIS GRID
    // =====================================

    for (
        let r = 0;
        r < SIZE;
        r++
    ) {

        for (
            let c = 0;
            c < SIZE;
            c++
        ) {

            const cell =
                document.createElement("button");

            cell.className =
             "word-search-cell";

            cell.textContent =
                cells[r][c];

            cell.dataset.row = r;
            cell.dataset.col = c;

            cell.addEventListener(
  "click",
  function() {
    
    // Kalau huruf sudah hijau
    if (
      this.classList.contains(
        "found-word-cell"
      )
    ) {
      
      // Semak sama ada huruf ini bertindih
      // dengan word yang belum dijumpai
      const canUseAgain =
        wordSearchPlaced.some(
          placedWord => {
            
            if (
              wordSearchFound.includes(
                placedWord.word
              )
            ) {
              return false;
            }
            
            return placedWord.positions.some(
              pos =>
              pos.row ===
              Number(this.dataset.row) &&
              pos.col ===
              Number(this.dataset.col)
            );
          }
        );
      
      // Kalau hanya word yang sudah siap,
      // jangan gerakkan bingkai pink
      if (!canUseAgain) {
        return;
      }
    }
    
    selectWordSearchCell(this);
    
  }
);

            grid.appendChild(cell);
        }
    }
}


// =====================================
// PILIH HURUF WORD SEARCH
// =====================================

function selectWordSearchCell(cell) {

    const alreadySelected =
        wordSearchSelection.includes(cell);

    // Kalau tekan semula huruf sama
    // buang huruf itu
    if (alreadySelected) {

        cell.classList.remove(
            "selected-cell"
        );

        cell.style.boxShadow = "";
        cell.style.background = "";

        wordSearchSelection =
            wordSearchSelection.filter(
                item => item !== cell
            );

        return;
    }


    // =====================================
    // HURUF PERTAMA
    // =====================================

    if (
        wordSearchSelection.length === 0
    ) {

        wordSearchSelection.push(cell);

        cell.classList.add(
            "selected-cell"
        );

        cell.style.boxShadow =
            "inset 0 0 0 3px #f06b91, 0 0 10px rgba(240,107,145,0.45)";

        cell.style.background =
            "#fff0f5";

        return;
    }


    const lastCell =
        wordSearchSelection[
            wordSearchSelection.length - 1
        ];

    const lastRow =
        Number(lastCell.dataset.row);

    const lastCol =
        Number(lastCell.dataset.col);

    const newRow =
        Number(cell.dataset.row);

    const newCol =
        Number(cell.dataset.col);

    const rowDiff =
        Math.abs(newRow - lastRow);

    const colDiff =
        Math.abs(newCol - lastCol);


// MESTI BERSEBELAHAN

if (
  !(
    (rowDiff === 1 && colDiff === 0) ||
    (rowDiff === 0 && colDiff === 1) ||
    (rowDiff === 1 && colDiff === 1)
  )
) {
  return;
}


// =====================================
// MESTI KEKAL SATU GARIS
// MELINTANG / MENEGAK / DIAGONAL
// =====================================

if (wordSearchSelection.length >= 2) {
  
  const firstCell =
    wordSearchSelection[0];
  
  const secondCell =
    wordSearchSelection[1];
  
  const firstRow =
    Number(firstCell.dataset.row);
  
  const firstCol =
    Number(firstCell.dataset.col);
  
  const secondRow =
    Number(secondCell.dataset.row);
  
  const secondCol =
    Number(secondCell.dataset.col);
  
  
  // Arah daripada huruf pertama ke kedua
  const rowStep =
    secondRow - firstRow;
  
  const colStep =
    secondCol - firstCol;
  
  
  // Mesti huruf seterusnya ikut arah sama
  const expectedRow =
    secondRow +
    rowStep * (wordSearchSelection.length - 1);
  
  const expectedCol =
    secondCol +
    colStep * (wordSearchSelection.length - 1);
  
  
  if (
    newRow !== expectedRow ||
    newCol !== expectedCol
  ) {
    return;
  }
}

    wordSearchSelection.push(cell);

    cell.classList.add(
        "selected-cell"
    );

    cell.style.boxShadow =
        "inset 0 0 0 3px #f06b91, 0 0 10px rgba(240,107,145,0.45)";

    cell.style.background =
        "#fff0f5";


    // Semak perkataan
    checkWordSearchSelection();
}


// =====================================
// SEMAK PERKATAAN YANG DIPILIH
// =====================================

function checkWordSearchSelection() {

    const selectedPositions =
        wordSearchSelection.map(cell => ({
            row:
                Number(cell.dataset.row),
            col:
                Number(cell.dataset.col)
        }));


    for (
        const placedWord
        of wordSearchPlaced
    ) {

        // Sudah jumpa
        if (
            wordSearchFound.includes(
                placedWord.word
            )
        ) {
            continue;
        }

        if (
            selectedPositions.length !==
            placedWord.positions.length
        ) {
            continue;
        }


        // Semak arah biasa
        const normalMatch =
            selectedPositions.every(
                (pos, index) =>
                    pos.row ===
                        placedWord.positions[index].row &&
                    pos.col ===
                        placedWord.positions[index].col
            );


        // Semak arah terbalik
        const reverseMatch =
            selectedPositions.every(
                (pos, index) => {

                    const reverseIndex =
                        placedWord.positions.length -
                        1 -
                        index;

                    return (
                        pos.row ===
                            placedWord.positions[
                                reverseIndex
                            ].row &&
                        pos.col ===
                            placedWord.positions[
                                reverseIndex
                            ].col
                    );
                }
            );


        if (
            normalMatch ||
            reverseMatch
        ) {

            wordFound(
                placedWord.word
            );

            return;
        }
    }
}


// =====================================
// WORD BETUL
// =====================================

function wordFound(word) {

    wordSearchFound.push(word);

    wordSearchSelection.forEach(cell => {

        cell.classList.remove(
            "selected-cell"
        );

        cell.classList.add(
            "found-word-cell"
        );

        cell.style.background =
            "#bbf7d0";

        cell.style.borderColor =
            "#22c55e";

        cell.style.color =
            "#166534";

        cell.style.boxShadow =
            "inset 0 0 0 2px #22c55e";
    });


    // Warna word dalam senarai
    const wordItem =
        document.querySelector(
            `.word-search-item[data-word="${word}"]`
        );

    if (wordItem) {

        wordItem.style.background =
            "#bbf7d0";

        wordItem.style.borderColor =
            "#22c55e";

        wordItem.style.color =
            "#166534";

        wordItem.style.textDecoration =
            "line-through";
    }


    // Bunyi betul
    playCorrectSound();

    wordSearchSelection = [];


    // =====================================
    // SEMUA 10 WORD SUDAH JUMPA
    // =====================================

    if (
        wordSearchFound.length ===
        wordSearchPlaced.length
    ) {

        setTimeout(() => {

            const feedback =
                document.getElementById(
                    "feedback"
                );

            feedback.innerHTML =
                "GOOD JOB 🎉";

            feedback.style.color =
                "#16a34a";

            feedback.style.borderColor =
                "#22c55e";

            feedback.classList.remove(
                "hidden"
            );


            document.getElementById(
                "final-msg"
            ).innerHTML =
                "🏆 EXCELLENT<br><span style='font-size:13px; white-space:nowrap;'>YOU COMPLETED THE WORD SEARCH 🎉</span>";


            setTimeout(() => {

                feedback.classList.add(
                    "hidden"
                );

                document.getElementById(
                    "end-screen"
                ).classList.remove(
                    "hidden"
                );

            }, 1600);

        }, 400);
    }
}





// =====================================
// BUTANG CLEAR WORD SEARCH
// =====================================

document.getElementById("clear-btn")
  .addEventListener("click", function() {
    
    playClickSound();
    
    // Buang pilihan huruf yang sedang pink sahaja
    wordSearchSelection.forEach(cell => {
      
      cell.classList.remove("selected-cell");
      
      cell.style.boxShadow = "";
      cell.style.background = "";
      
    });
    
    // Kosongkan pilihan semasa
    wordSearchSelection = [];
    
  });


// =====================================
// BUNYI CLICK UNTUK BUTANG LAIN
// =====================================

document.querySelectorAll(
  "button:not(#back-btn):not(#clear-btn)"
).forEach(button => {
  
  button.addEventListener("click", function() {
    playClickSound();
  });
  
});

</script>
