<script>

function toggleNumbersSudokuMenu(){

    const menu =
        document.getElementById("numbersSudokuMenu");

    menu.style.display =
        (menu.style.display === "none" ||
         menu.style.display === "")
        ? "block"
        : "none";
}


function toggleColoursSudokuMenu(){

    const menu =
        document.getElementById("coloursSudokuMenu");

    menu.style.display =
        (menu.style.display === "none" ||
         menu.style.display === "")
        ? "block"
        : "none";
}


/* =====================================================
   PLAYER MANAGER
   1 ACCOUNT = MAXIMUM 4 PLAYERS
===================================================== */

async function getPlayerNamesForAccount(uid){

    if (!uid) return [];

    const playerRef =
        window.sudokuDoc(
            window.sudokuDB,
            "sudokuPlayerNames",
            uid
        );

    const playerSnap =
        await window.sudokuGetDoc(playerRef);

    if (!playerSnap.exists()){
        return [];
    }

    const names =
        playerSnap.data().names || [];

    return Array.isArray(names)
        ? names.slice(0, 4)
        : [];
}


/* =====================================================
   OPEN / CLOSE PLAYER MANAGER
===================================================== */

async function togglePlayerManager(){

    const box =
        document.getElementById(
            "playerManagerBox"
        );

    if (!box) return;


    const user =
        await window.sudokuAuthReady;


    if (!user){

        alert("Please login first.");

        return;
    }


    if (box.style.display === "block"){

        box.style.display = "none";

        return;
    }


    box.style.display = "block";

    await renderPlayerList();
}


/* =====================================================
   DISPLAY PLAYER LIST
===================================================== */

async function renderPlayerList(){

    const user =
        await window.sudokuAuthReady;

    if (!user) return;


    const list =
        document.getElementById(
            "playerList"
        );

    const status =
        document.getElementById(
            "playerStatus"
        );

    const selectedDisplay =
        document.getElementById(
            "selectedPlayerDisplay"
        );


    if (
        !list ||
        !status ||
        !selectedDisplay
    ){

        return;
    }


    const names =
        await getPlayerNamesForAccount(
            user.uid
        );


    /* =================================================
       AMBIL PEMAIN YANG SEDANG DIPILIH
    ================================================= */

    const selected =
        sessionStorage.getItem(
            "sudokuSelectedPlayer"
        ) ||
        localStorage.getItem(
            "sudokuSelectedPlayer"
        );


    list.innerHTML = "";


    names.forEach((name) => {

        const row =
            document.createElement("div");

        row.className =
            "player-choice";


        /* =============================================
           PLAYER SEDANG DIPILIH
        ============================================= */

        if (
            selected &&
            selected.toLowerCase() ===
            name.toLowerCase()
        ){

            row.classList.add(
                "selected"
            );

            selectedDisplay.textContent =
                "🎮 Selected Player: " +
                name;
        }


        /* =============================================
           NAMA PEMAIN
        ============================================= */

        const nameSpan =
            document.createElement("span");

        nameSpan.className =
            "player-choice-name";

        nameSpan.textContent =
            name;

        nameSpan.onclick =
            () => selectPlayer(name);


        /* =============================================
           DELETE BUTTON
        ============================================= */

        const deleteBtn =
            document.createElement("button");

        deleteBtn.type = "button";

        deleteBtn.className =
            "delete-player";

        deleteBtn.textContent =
            "🗑️ DELETE";


        deleteBtn.onclick =
            (event) => {

                event.stopPropagation();

                deletePlayer(name);
            };


        row.appendChild(nameSpan);

        row.appendChild(deleteBtn);

        list.appendChild(row);

    });


    /* =============================================
       TIADA PLAYER
    ============================================= */

    if (names.length === 0){

        list.innerHTML = `
            <div class="player-choice">

                <span class="player-choice-name">
                    No players added yet
                </span>

            </div>
        `;

        selectedDisplay.textContent =
            "No player selected";
    }


    /* =============================================
       STATUS 0/4, 1/4, 2/4...
    ============================================= */

    status.textContent =
        names.length +
        "/4 players used";
}


/* =====================================================
   SELECT PLAYER
===================================================== */

async function selectPlayer(name){

    const user =
        await window.sudokuAuthReady;


    if (!user){

        alert("Please login first.");

        return;
    }


    /* =================================================
       SIMPAN NAMA PEMAIN YANG DIPILIH
       SESSION + LOCAL STORAGE
    ================================================= */

    sessionStorage.setItem(
        "sudokuSelectedPlayer",
        name
    );

    localStorage.setItem(
        "sudokuSelectedPlayer",
        name
    );


    /* =================================================
       SIMPAN UID AKAUN
    ================================================= */

    sessionStorage.setItem(
        "sudokuSelectedPlayerUid",
        user.uid
    );

    localStorage.setItem(
        "sudokuSelectedPlayerUid",
        user.uid
    );


    /* =================================================
       REFRESH PAPARAN
    ================================================= */

    await renderPlayerList();
}


/* =====================================================
   ADD NEW PLAYER
   1 ACCOUNT = MAXIMUM 4 PLAYERS
===================================================== */

async function addNewPlayer() {

    const input =
        document.getElementById(
            "newPlayerName"
        );


    if (!input) {

        alert(
            "Player name input not found."
        );

        return;
    }


    const name =
        input.value.trim();


    /* =================================================
       NAMA KOSONG
    ================================================= */

    if (!name) {

        alert(
            "Please enter a player name."
        );

        return;
    }


    /* =================================================
       MAXIMUM 20 CHARACTERS
    ================================================= */

    if (name.length > 20) {

        alert(
            "Player name can have a maximum of 20 characters."
        );

        return;
    }


    try {

        /* =============================================
           WAIT FOR LOGIN
        ============================================= */

        const user =
            await window.sudokuAuthReady;


        if (!user) {

            alert(
                "Please login first."
            );

            return;
        }


        /* =============================================
           FIRESTORE REFERENCE
        ============================================= */

        const playerRef =
            window.sudokuDoc(
                window.sudokuDB,
                "sudokuPlayerNames",
                user.uid
            );


        const playerSnap =
            await window.sudokuGetDoc(
                playerRef
            );


        /* =============================================
           GET EXISTING NAMES
        ============================================= */

        let names = [];


        if (playerSnap.exists()) {

            names =
                playerSnap.data().names || [];

        }


        if (!Array.isArray(names)) {

            names = [];

        }


        names =
            names.filter(
                name => name
            );


        /* =============================================
           CHECK DUPLICATE
        ============================================= */

        const alreadyExists =
            names.some(
                existingName =>

                String(existingName)
                    .trim()
                    .toLowerCase() ===
                name.toLowerCase()
            );


        if (alreadyExists) {

            alert(
                "This player name already exists."
            );

            return;
        }


        /* =============================================
           MAXIMUM 4 PLAYERS
        ============================================= */

        if (names.length >= 4) {

            alert(
                "One account can have a maximum of 4 players."
            );

            return;
        }


        /* =============================================
           ADD NEW NAME
        ============================================= */

        names.push(name);


        await window.sudokuSetDoc(
            playerRef,
            {
                uid: user.uid,
                names: names
            }
        );


        /* =============================================
           CLEAR INPUT
        ============================================= */

        input.value = "";


        /* =============================================
           REFRESH PLAYER LIST
        ============================================= */

        await renderPlayerList();


    } catch (error) {

        console.error(
            "ADD PLAYER ERROR:",
            error
        );


        alert(
            "Unable to add player.\n\n" +
            error.message
        );

    }
}

/* =====================================================
   DELETE PLAYER
===================================================== */

async function deletePlayer(name){

    const confirmDelete =
        confirm(
            'Delete player "' +
            name +
            '"?'
        );


    if (!confirmDelete) return;


    const user =
        await window.sudokuAuthReady;


    if (!user) return;


    const playerRef =
        window.sudokuDoc(
            window.sudokuDB,
            "sudokuPlayerNames",
            user.uid
        );


    const playerSnap =
        await window.sudokuGetDoc(
            playerRef
        );


    if (!playerSnap.exists()) return;


    let names =
        playerSnap.data().names || [];


    names =
        names.filter(
            existingName =>
                existingName !== name
        );


    await window.sudokuSetDoc(
        playerRef,
        {
            uid: user.uid,
            names: names
        }
    );


    const selected =
        sessionStorage.getItem(
            "sudokuSelectedPlayer"
        );


    if (
        selected &&
        selected.toLowerCase() ===
        name.toLowerCase()
    ){

        sessionStorage.removeItem(
            "sudokuSelectedPlayer"
        );

        sessionStorage.removeItem(
            "sudokuSelectedPlayerUid"
        );
    }


    await renderPlayerList();
}

</script>
