import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    saveSudokuResult
} from "./sudokuLeaderboard.js";


const firebaseConfig = {
    apiKey: "AIzaSyB0crUiSYBTxye5nHDOYJ8I7dNAv-mLO7g",
    authDomain: "he-bloom-edu-games.firebaseapp.com",
    projectId: "he-bloom-edu-games",
    storageBucket: "he-bloom-edu-games.firebasestorage.app",
    messagingSenderId: "629319143905",
    appId: "1:629319143905:web:2a989f47e473c4ad7302a0"
};


// Guna Firebase app yang sedia ada
const app = getApps().length
    ? getApp()
    : initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);


// Benarkan finishGame() guna fungsi ini
window.saveSudokuResult = saveSudokuResult;


// DATA PEMAIN
window.firebasePlayerName = "Unknown Player";
window.firebasePlayerUid = null;
window.saveSudokuResult = saveSudokuResult;


onAuthStateChanged(auth, async (user) => {

    if (!user) {
        console.log("Tiada akaun Firebase.");
        return;
    }

    try {

        const uid = user.uid;

        window.firebasePlayerUid = uid;


        const playerRef =
            doc(db, "sudokuPlayers", uid);

        const playerSnap =
            await getDoc(playerRef);


        if (playerSnap.exists()) {

            const data =
                playerSnap.data();

            window.firebasePlayerName =
                data.name || "Unknown Player";


            console.log(
                "Nama Firebase:",
                window.firebasePlayerName
            );

            console.log(
                "UID Firebase:",
                window.firebasePlayerUid
            );


            // Beritahu code utama nama sudah siap
            window.dispatchEvent(
                new CustomEvent(
                    "firebasePlayerReady",
                    {
                        detail: {
                            name:
                                window.firebasePlayerName,
                            uid:
                                window.firebasePlayerUid
                        }
                    }
                )
            );

        }

    } catch (error) {

        console.error(
            "Gagal ambil data Firebase:",
            error
        );

    }

});

</script>

/* ===== COLOURS SUDOKU STYLE ===== */

#game-card {
    width: 500%;
    max-width: 500px;
    
    height: 800px;
    min-height: 800px;
    
    margin: 0 auto;
    padding: 60px 24px;
    
    box-sizing: border-box;
    
    background: rgba(235, 255, 250, 0.10);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    
    border: 3px solid rgba(255, 255, 255, 0.85);
    border-radius: 10px;
    
    box-shadow:
        0 0 0 3px rgba(255, 255, 255, 0.25),
        0 12px 35px rgba(70, 130, 120, 0.18);
}

/* Grid Sudoku */
#sudoku-grid {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    
    background: rgba(255, 255, 255, 0.82);
    border: 5px solid #f3a6bb;
    border-radius: 32px;
    
    box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.12),
        inset 0 0 0 2px rgba(255, 255, 255, 0.8);
}

#sudoku-grid button {
    background: rgba(255, 255, 255, 0.72);
    border: 1px solid #efc2ce;
    transition: all 0.15s ease;
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
}
    
/* ===== 9 KAWASAN SUDOKU 3×3 ===== */

/* 2 GARISAN MENEGAK — SAMPAI BAWAH */
#sudoku-grid button:nth-child(3n):not(:nth-child(9n)) {
    border-right: 4px solid #f06b91 !important;
}

/* 2 GARISAN MELINTANG — SELEPAS BARIS 3 & 6 */
#sudoku-grid button:nth-child(n+19):nth-child(-n+27) {
    border-bottom: 4px solid #f06b91 !important;
}

#sudoku-grid button:nth-child(n+46):nth-child(-n+54) {
    border-bottom: 4px solid #f06b91 !important;
}


/* ===== BUTANG WARNA ===== */
#answers {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    width: 70%;
    max-width: 420px;
    margin: 2px auto 0;
    justify-items: center;
}

#answers button {
    min-height: 40px;
    width: 100%;
    padding: 2px;
    border-radius: 9px;
    font-size: 10px;
    font-weight: 700;
    
    border: 2px solid rgba(255, 255, 255, 0.9);
    
    box-shadow:
        0 3px 6px rgba(0, 0, 0, 0.14),
        inset 0 1px 2px rgba(255, 255, 255, 0.35);
    
    transition: transform 0.15s ease;
}

#answers button:hover {
    transform: translateY(-4px) scale(1.03);
}

#answers button:active {
    transform: scale(0.96);
}


/* ===== BARIS KEDUA: 4 BUTANG TENGAH ===== */
/* ORANGE, RED, DARK BROWN, BLACK */

#answers button:nth-child(6) {
    grid-column: 1;
}

#answers button:nth-child(7) {
    grid-column: 2;
}

#answers button:nth-child(8) {
    grid-column: 4;
}

#answers button:nth-child(9) {
    grid-column: 5;
}


/* ===== DELETE + BACK ===== */
#bottom-buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    margin-top: 2px !important;
}

<script>
let audioCtx = null;
let musicInterval = null;
let musicPlaying = false;

function getAudioCtx() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
if (audioCtx.state === "suspended") {
audioCtx.resume();
}
return audioCtx;
} 

function playClickSound() {
    const ctx = getAudioCtx();
    
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    osc.frequency.value = 600;
    gain.gain.value = 0.08;
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    
    osc.start();
    osc.stop(ctx.currentTime + 0.08);
}

function toggleMusic() {
    const ctx = getAudioCtx();
    
    if (musicPlaying) {
        stopMusic();
        return;
    }
    
    musicPlaying = true;
    document.getElementById("music-btn").textContent = "🎵";
    playMusicLoop();
}

function playMusicLoop() {
    const ctx = getAudioCtx();
    
    const notes = [262, 294, 330, 349, 392, 349, 330, 294];
    let i = 0;
    
    function playNote() {
        if (!musicPlaying) return;
        
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        
        o.connect(g);
        g.connect(ctx.destination);
        
        o.type = "sine";
        o.frequency.value = notes[i % notes.length];
        
        g.gain.setValueAtTime(0.08, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(
            0.01,
            ctx.currentTime + 0.4
        );
        
        o.start();
        o.stop(ctx.currentTime + 0.4);
        
        i++;
    }
    
    playNote();
    musicInterval = setInterval(playNote, 500);
}

function stopMusic() {
    musicPlaying = false;
    
    clearInterval(musicInterval);
    
    document.getElementById("music-btn").textContent = "🔇";
}


function playCorrectSound() {
    const ctx = getAudioCtx();
    
    const notes = [523, 659, 784];
    
    notes.forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        
        o.connect(g);
        g.connect(ctx.destination);
        
        o.type = "sine";
        o.frequency.value = freq;
        
        g.gain.setValueAtTime(0.001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(
            0.08,
            ctx.currentTime + 0.03
        );
        g.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + 0.25
        );
        
        o.start(ctx.currentTime + i * 0.12);
        o.stop(ctx.currentTime + i * 0.12 + 0.25);
    });
}

function playWrongSound() {
    const ctx = getAudioCtx();
    
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    
    o.connect(g);
    g.connect(ctx.destination);
    
    o.type = "sawtooth";
    o.frequency.value = 180;
    
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(
        0.08,
        ctx.currentTime + 0.03
    );
    g.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 0.4
    );
    
    o.start();
    o.stop(ctx.currentTime + 0.4);
}

let timerInterval = null;

let sudokuQuestions = [];

function generateRandomSudoku() {
    
    const colors = [
        "PINK",
        "BLUE",
        "GREEN",
        "YELLOW",
        "PURPLE",
        "ORANGE",
        "RED",
        "DARK BROWN",
        "BLACK"
    ];
    
    // Corak asas Sudoku 9x9
    const base = [];
    
    for (let row = 0; row < 9; row++) {
        for (let col = 0; col < 9; col++) {
            base.push(
                (row * 3 + Math.floor(row / 3) + col) % 9
            );
        }
    }
    
    // Acak 9 warna
    const shuffledColors = [...colors]
        .sort(() => Math.random() - 0.5);
    
    // Sudoku lengkap 9x9
    const solution = base.map(
        n => shuffledColors[n]
    );
    
    // Salin untuk petak permainan
    const grid = [...solution];
    
    // Hard — lebih banyak petak kosong
    const emptyCount =
    Math.floor(Math.random() * 2) + 13; 
    
    // Pilih lokasi kosong secara rawak
    const positions = [...Array(81).keys()]
        .sort(() => Math.random() - 0.5);
    
    for (let i = 0; i < emptyCount; i++) {
        grid[positions[i]] = null;
    }
    

return {
    grid: grid,
    initialGrid: [...grid],
    solution: solution
};
}

function generateQuestions() {
    
    sudokuQuestions = [];
    
    // 10 round
    for (let i = 0; i < 10; i++) {
        sudokuQuestions.push(
            generateRandomSudoku()
        );
    }
}

        grid.appendChild(button);
    });
}

renderSudokuGrid();


function updateTimer() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;

    document.getElementById("timer").textContent =
        `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
}


function startTimer() {
    updateTimer();

    timerInterval = setInterval(() => {

        if (gameFinished) return;

        timeLeft--;

        if (timeLeft <= 0) {
            timeLeft = 0;
            updateTimer();
            finishGame(true);
            return;
        }

        updateTimer();

    }, 1000);
}


function finishGame(timeUp = false) {
    
    if (gameFinished) return;
    
    gameFinished = true;
    answerLocked = true;
    
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
    
    const elapsed = (30 * 60) - timeLeft;
    
// =========================
// SIMPAN KE FIREBASE
// COLOURS SUDOKU HARD
// =========================

if (!timeUp && score === 10) {
    
    const saveResult = () => {
        
        const name =
            window.firebasePlayerName;
        
        const uid =
            window.firebasePlayerUid;
        
        console.log(
            "Cuba simpan leaderboard:",
            name,
            uid
        );
        
        if (
            !name ||
            name === "Unknown Player" ||
            !uid
        ) {
            console.log(
                "⏳ Nama Firebase belum siap, cuba lagi..."
            );
            
            setTimeout(saveResult, 500);
            return;
        }
        
        if (!window.saveSudokuResult) {
            
            console.error(
                "❌ saveSudokuResult tidak tersedia."
            );
            
            return;
        }
        
        window.saveSudokuResult(
                name,
                "colours",
                "hard",
                elapsed,
                uid
            )
            .then(() => {
                
                console.log(
                    "✅ NAMA BERJAYA DISIMPAN:",
                    name
                );
                
            })
            .catch((error) => {
                
                console.error(
                    "❌ Gagal simpan leaderboard:",
                    error
                );
                
            });
        
    };
    
    saveResult();
}


// =========================
// PAPAR END SCREEN
// =========================

const endScreen =
    document.getElementById("end-screen");

const finalScore =
    document.getElementById("final-score");

const finalMsg =
    document.getElementById("final-msg");


finalScore.textContent =
    `${score} / 10`;


if (timeUp) {
    
    finalMsg.innerHTML =
        "⏰ TIME'S UP<br>❤️ DON'T GIVE UP";
    
} else if (
    score === 10 &&
    elapsed <= 10 * 60
) {
    
    finalMsg.textContent =
        "🏆 EXCELLENT";
    
} else if (
    score === 10 &&
    elapsed > 10 * 60
) {
    
    finalMsg.textContent =
        "👍 GREAT JOB";
    
} else {
    
    finalMsg.textContent =
        "💪 DON'T GIVE UP";
}


endScreen.classList.remove("hidden");
}

function nextRound() {

    // Round 10 selesai = tamat game
    if (currentQuestion >= sudokuQuestions.length - 1) {
        finishGame(false);
        return;
    }

    currentQuestion++;

    
    answerLocked = false;
    selectedCell = null;

    renderSudokuGrid();
    setupSudokuCells();

highlightNextEmptyCell();

    document.getElementById("question-number").textContent =
        `${currentQuestion + 1} / ${sudokuQuestions.length}`;
}</script>

function checkSudokuAnswer(grid) {
    
    // ===== SEMAK 9 BARIS =====
    for (let row = 0; row < 9; row++) {
        
        const rowColors = [];
        
        for (let col = 0; col < 9; col++) {
            rowColors.push(grid[row * 9 + col]);
        }
        
        // Mesti ada 9 warna berbeza
        if (new Set(rowColors).size !== 9) {
            return false;
        }
    }
    
    
    // ===== SEMAK 9 KOLUM =====
    for (let col = 0; col < 9; col++) {
        
        const colColors = [];
        
        for (let row = 0; row < 9; row++) {
            colColors.push(grid[row * 9 + col]);
        }
        
        // Mesti ada 9 warna berbeza
        if (new Set(colColors).size !== 9) {
            return false;
        }
    }
    
    
    // ===== SEMAK 9 BLOK 3 × 3 =====
    for (let blockRow = 0; blockRow < 9; blockRow += 3) {
        
        for (let blockCol = 0; blockCol < 9; blockCol += 3) {
            
            const blockColors = [];
            
            for (let row = blockRow; row < blockRow + 3; row++) {
                
                for (let col = blockCol; col < blockCol + 3; col++) {
                    
                    blockColors.push(
                        grid[row * 9 + col]
                    );
                    
                }
            }
            
            // Mesti ada 9 warna berbeza
            if (new Set(blockColors).size !== 9) {
                return false;
            }
        }
    }
    
    
    // ===== SEMUA BETUL =====
    return true;
}

function highlightNextEmptyCell() {
    
    const current = sudokuQuestions[currentQuestion];
    
    const nextEmptyIndex =
        current.grid.findIndex(color => !color);
    
    const cells =
        document.querySelectorAll("#sudoku-grid button");
    
    cells.forEach(cell => {
        cell.style.boxShadow = "";
        cell.style.background =
            "rgba(255, 255, 255, 0.72)";
    });
    
    if (nextEmptyIndex !== -1) {
    
    const targetCell = cells[nextEmptyIndex];
    
    selectedCell = targetCell;
    
    targetCell.style.boxShadow =
        "inset 0 0 0 4px #f06b91, 0 0 12px rgba(240,107,145,0.45)";
    
    targetCell.style.background = "#fff5f8";
}
}



let selectedCell = null;
function highlightTargetCell() {
    sudokuCells.forEach(cell => {
        cell.style.boxShadow = "";
        cell.style.background = "rgba(255, 255, 255, 0.72)";
    });
    
    const current = sudokuQuestions[currentQuestion];
    
    if (!current) return;
    
    const targetCell = sudokuCells[current.cell - 1];
    
    if (!targetCell) return;
    
    targetCell.style.boxShadow =
        "inset 0 0 0 4px #f06b91, 0 0 12px rgba(240,107,145,0.45)";
    
    targetCell.style.background = "#fff5f8";
}

function setupSudokuCells() {
    
    sudokuCells = document.querySelectorAll("#sudoku-grid button");
    
    const current = sudokuQuestions[currentQuestion];
    
    sudokuCells.forEach(cell => {
        
        cell.addEventListener("click", function() {
            
            const index = Number(this.dataset.index);
            
            // WARNA ASAL TIDAK BOLEH DIPILIH
            if (current.initialGrid[index] !== null) {
                selectedCell = null;
                return;
            }
            
            // Buang highlight kotak lain
            sudokuCells.forEach(c => {
                c.style.boxShadow = "";
                c.style.background =
                    "rgba(255, 255, 255, 0.72)";
            });
            
            // Pilih kotak kosong / warna yang pemain isi
            selectedCell = this;
            
            this.style.boxShadow =
                "inset 0 0 0 4px #f06b91, 0 0 12px rgba(240,107,145,0.45)";
            
            this.style.background = "#fff5f8";
            
});
        
    });
}

        selectedCell.style.background = "#fff5f8";
        
    });

document.querySelectorAll("button:not(#back-btn)").forEach(button => {
    button.addEventListener("click", function() {
        playClickSound();
    });
});


</script>
