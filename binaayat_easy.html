    function resizeGame() {
    
    const game = document.getElementById("game-card");
    
    if (!game) return;
    
    /* SAIZ ASAL */
    const baseWidth = 700;
    
    /* LEBAR SKRIN */
    const availableWidth = window.innerWidth - 20;
    
    /* SCALE IKUT LEBAR */
    let scale = availableWidth / baseWidth;
    
    /* JANGAN LEBIH BESAR DARIPADA SAIZ ASAL */
    scale = Math.min(scale, 1);
    
    /* APPLY SCALE */
    game.style.zoom = scale;
}

/* UPDATE BILA SKRIN BERUBAH */
window.addEventListener("resize", resizeGame);

        function getAudioCtx() {

        function playCorrectSound() {
            const ctx = getAudioCtx();
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'sine'; o.frequency.setValueAtTime(523, ctx.currentTime);
            o.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
            o.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
            g.gain.setValueAtTime(0.3, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            o.start(); o.stop(ctx.currentTime + 0.4);
        }

        function playWrongSound() {
            const ctx = getAudioCtx();

    }
    
    musicPlaying = true;
    
    document.getElementById('music-btn').textContent = '🎵';
    
    playMusicLoop();
}

        let musicInterval;
        function playMusicLoop() {
            const ctx = getAudioCtx();
            const notes = [262,294,330,349,392,349,330,294];
            let i = 0;
            function playNote() {
                if (!musicPlaying) return;
                const o = ctx.createOscillator(); const g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.type = 'sine'; o.frequency.value = notes[i % notes.length];
                g.gain.setValueAtTime(0.08, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                o.start(); o.stop(ctx.currentTime + 0.4);
                i++;
            }
            playNote();
            musicInterval = setInterval(playNote, 500);
        }

        function stopMusic() {
            musicPlaying = false;
            clearInterval(musicInterval);
            document.getElementById('music-btn').textContent = '🔇 ';
        }

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

let selectedWords = [];

        function generateQuestions() {
    
    // Ambil 40 soalan secara rawak daripada semua soalan yang tersedia
    const selected = shuffle([...words]).slice(0, 40);
    
    questions = selected.map(item => {
        
        let shuffled;
        
        do {
            shuffled = shuffle([...item.answer]);
        } while (shuffled.join(" ") === item.answer.join(" "));
        
        return {
            image: item.image,
            answer: item.answer,
            options: shuffled
        };
        
    });
    
}

function addWord(word, btn) {
  
  playClickSound();
  selectedWords.push(word);
  
  btn.disabled = true;
  btn.style.visibility = "hidden";
  
  document.getElementById("sentenceBox").innerHTML =
    selectedWords.join(" ");
  
  checkSentence();
  
}

function removeWord() {
    
    if (selectedWords.length === 0) return;
    
    // Ambil perkataan terakhir yang dipadam
    const removedWord = selectedWords.pop();
    
    // Kemas kini ayat dalam kotak
    document.getElementById("sentenceBox").innerHTML =
        selectedWords.join(" ");
    
    // Cari button yang sepadan dengan perkataan yang dipadam
    const buttons = document.querySelectorAll("#answers button");
    
    buttons.forEach(btn => {
        
        if (btn.textContent === removedWord) {
            btn.disabled = false;
            btn.style.visibility = "visible";
        }
        
    });
}

function checkSentence() {
    
    const q = questions[currentQ];
    
    // Belum lengkapkan ayat
    if (selectedWords.length !== q.answer.length) return;
    
    // JAWAPAN BETUL
    if (selectedWords.join(" ") === q.answer.join(" ")) {
        
        // HANYA jawapan lengkap pertama yang betul dapat +1
        if (firstTry === true) {
            score++;
            document.getElementById("score-val").textContent = score;
        }
        
        playCorrectSound();
        
        showFeedback("✅ BETUL 🎉", "text-green-500");
        
        setTimeout(() => {
            hideFeedback();
            
            currentQ++;
            
            if (currentQ >= 40) {
                showEnd();
            } else {
                renderQuestion();
            }
            
        }, 1000);
        
    }
    
    // JAWAPAN SALAH
    else {
        
        // Mulai sekarang soalan ini tidak boleh dapat markah
        firstTry = false;
        
        playWrongSound();
        
        showFeedback("❌ CUBA LAGI", "text-red-500");
        
        setTimeout(() => {
            
            hideFeedback();
            
            selectedWords = [];
            
            document.getElementById("sentenceBox").innerHTML = "";
            
            document.querySelectorAll("#answers button").forEach(btn => {
                btn.disabled = false;
                btn.style.visibility = "visible";
            });
            
        }, 800);
    }
}


function renderQuestion() {
  
  selectedWords = [];
  firstTry = true;
  
  const q = questions[currentQ];
  
  document.getElementById("q-num").textContent = currentQ + 1;
  document.getElementById("score-val").textContent = score;
  
  document.getElementById("sentenceBox").innerHTML = "";
  
  document.getElementById("question-image").innerHTML =
    `<img src="${q.image}" class="question-img">`;
  
  const answers = document.getElementById("answers");
  answers.innerHTML = "";
  
  q.options.forEach((word, i) => {
    
    const btn = document.createElement("button");
    
    btn.className =
  `btn-answer ${btnColors[i % btnColors.length]} text-white font-bold px-5 py-3 rounded-xl shadow-lg border-2 border-white`;
  btn.style.boxShadow =
  "0 0 0 2px rgba(255,255,255,.85),0 0 1px rgba(255,255,255,.55),0 8px 18px rgba(0,0,0,.2)";
  
    btn.textContent = word;
    
    btn.onclick = () => addWord(word, btn);
    
    answers.appendChild(btn);
    
  });
  
}

        function checkAnswer(selected, correct, btn) {
            if (answered) return;
            if (selected === correct) {
                answered = true;
                if (firstTry) {
                   score++;
                }
                
                playCorrectSound();
                showFeedback('✅ BETUL 🎉', 'text-green-500');
                setTimeout(() => {
                    hideFeedback();
                    currentQ++;
                    if (currentQ >= 40) showEnd();
                    else renderQuestion();
                }, 1000);
            } else {
                firstTry = false;
                playWrongSound();
                btn.classList.add('shake');
                showFeedback('❌ CUBA LAGI', 'text-red-500');
                setTimeout(() => {
                    hideFeedback();
                    btn.classList.remove('shake');
                }, 800);
            }
        }

function playClickSound() {
  
  const ctx = getAudioCtx();
  
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  
  o.connect(g);
  g.connect(ctx.destination);
  
  o.type = "triangle";
  o.frequency.value = 700;
  
  g.gain.setValueAtTime(0.08, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
  
  o.start();
  o.stop(ctx.currentTime + 0.08);
  
}


function showFeedback(text, cls) {
    const fb = document.getElementById('feedback');
    const ft = document.getElementById('feedback-text');

    ft.innerHTML = `
    <div style="
        background:#ffffff;
        border:4px solid ${cls.includes('green') ? '#22c55e' : '#ef4444'};
        border-radius:20px;
        padding:15px 25px;
        display:inline-block;
        box-shadow:0 8px 20px rgba(0,0,0,0.35);
        font-size:30px;
        font-weight:900;
        color:${cls.includes('green') ? '#22c55e' : '#ef4444'};
    ">
        ${text.replace('\n','<br>')}
    </div>`;

    fb.classList.remove('hidden');
}

        function hideFeedback() {
            document.getElementById('feedback').classList.add('hidden');
        }

        function showEnd() {
    document.getElementById('game-card').classList.add('hidden');
    
    const end = document.getElementById('end-screen');
    end.classList.remove('hidden');
    
    document.getElementById('final-score').textContent = `${score} / 40`;
    
    let msg = "";
    
    if (score >= 36) {
    msg = "🏆 CEMERLANG";
} else if (score >= 30) {
    msg = "👏 SYABAS";
} else if (score >= 24) {
    msg = "😊 TERUS BERUSAHA";
} else {
    msg = "❤️ JANGAN PUTUS ASA";
}
    
    document.getElementById('final-msg').textContent = msg;
}
        function restartGame() {
            score = 0; currentQ = 0;
            generateQuestions();
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('game-card').classList.remove('hidden');
            renderQuestion();
        }

        generateQuestions();
        renderQuestion();
    </script>
