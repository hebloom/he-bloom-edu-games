/* =====================================================
   RESPONSIVE TAMBAHAN - SEMUA DEVICE
   HP KECIL / HP BESAR / TABLET / LAPTOP / DESKTOP
   PORTRAIT + LANDSCAPE
   DESIGN ASAL DIKEKALKAN
   ===================================================== */

html {
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
  overflow-y: auto;
}

body {
  width: 100%;
  min-height: 100vh;
  overflow-x: hidden;
  overflow-y: auto;
  box-sizing: border-box;
}


/* ===== SEMUA SKRIN ===== */

#game-card {
  box-sizing: border-box;
  width: 90%;
  max-width: 700px;
  margin-left: auto;
  margin-right: auto;
}

#animal-list {
  width: 100%;
  max-width: 700px;
  box-sizing: border-box;
}

.vocab-card,
.vocab-card img,
.title-box {
  box-sizing: border-box;
  max-width: 100%;
}


/* =====================================================
   HP KECIL
   ===================================================== */

@media (max-width: 380px) {
  
  #game-card {
    width: 96%;
    padding-left: 6px;
    padding-right: 6px;
  }
  
  #animal-list {
    gap: 10px !important;
  }
  
  .vocab-card {
    padding-left: 7px;
    padding-right: 7px;
  }
  
  .vocab-card img {
    width: 90px;
    height: 90px;
  }
  
  .vocab-letter {
    font-size: 25px;
  }
  
  .vocab-word {
    font-size: 14px;
  }
  
  .title-box h1 {
    font-size: 32px;
  }
}


/* =====================================================
   HP BESAR
   ===================================================== */

@media (min-width: 381px) and (max-width: 600px) {
  
  #game-card {
    width: 94%;
    padding-left: 8px;
    padding-right: 8px;
  }
  
  #animal-list {
    gap: 14px !important;
  }
  
  .vocab-card img {
    width: 105px;
    height: 105px;
  }
}


/* =====================================================
   TABLET
   ===================================================== */

@media (min-width: 601px) and (max-width: 1024px) {
  
  #game-card {
    width: 88%;
    max-width: 700px;
  }
  
  #animal-list {
    gap: 18px !important;
  }
  
  .vocab-card img {
    width: 115px;
    height: 115px;
  }
}


/* =====================================================
   LAPTOP
   ===================================================== */

@media (min-width: 1025px) and (max-width: 1440px) {

    width: 90%;
    max-width: 700px;
  }

  }

/* =====================================================
   DESKTOP / KOMPUTER BESAR
   ===================================================== */

  #game-card {
    width: 90%;
    max-width: 700px;
  }

  }
}


/* =====================================================
   LANDSCAPE - SEMUA DEVICE
   Tidak potong kandungan.
   Jika tinggi tidak cukup → boleh scroll.
   ===================================================== */

   LANDSCAPE SKRIN RENDAH

  <script>
  
  let musicPlaying = false;
let musicInterval;

let audioCtx;

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
  }
  
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
  
  return audioCtx;
}

function playClickSound() {
  const ctx = getAudioCtx();
  
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  
  o.frequency.value = 600;
  g.gain.value = 0.08;
  
  o.connect(g);
  g.connect(ctx.destination);
  
  o.start();
  o.stop(ctx.currentTime + 0.08);
}

function toggleMusic() {
  
  playClickSound(); // bunyi klik setiap kali tekan
  
  const ctx = getAudioCtx();
  
  if (musicPlaying) {
    stopMusic();
    return;
  }
  
  musicPlaying = true;
  
  // Tekan pertama = music ON
  document.getElementById('music-btn').textContent = '🎵';
  
  playMusicLoop();
}

function playMusicLoop() {
  const ctx = getAudioCtx();
  
  const notes = [262, 294, 330, 349, 392, 349, 330, 294];
  
  let i = 0;
  
  function playNote() {
    if (!musicPlaying) return;
    
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    
    o.connect(g);
    g.connect(ctx.destination);
    
    o.frequency.setValueAtTime(notes[i], ctx.currentTime);
    
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(
      0.01,
      ctx.currentTime + 0.3
    );
    
    o.start();
    o.stop(ctx.currentTime + 0.3);
    
    i++;
    
    if (i >= notes.length) {
      i = 0;
    }
  }
  
  playNote();
  
  musicInterval = setInterval(playNote, 500);
}

function stopMusic() {
  musicPlaying = false;
  
  clearInterval(musicInterval);
  
  document.getElementById("music-btn").textContent = "🔇";
}
